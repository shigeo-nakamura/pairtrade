name: Deploy Arcus live-tick event archive

# bot-strategy#825: install a private, immutable daily archive for the
# live-tick-owned hash-chained event stream. This workflow enables only the
# archive timer. It never invokes the trading executor and never changes the
# arcus-spot-live-tick service/timer lifecycle.
on:
  pull_request:
    paths:
      - ".github/workflows/deploy-arcus-live-tick-event-archive.yml"
      - "deploy/archive-arcus-live-tick-events.service"
      - "deploy/archive-arcus-live-tick-events.timer"
      - "scripts/archive_arcus_live_tick_events.sh"
      - "scripts/arcus_live_tick_event_stream.py"
      - "scripts/install_arcus_live_tick_event_archive.sh"
      - "scripts/test_archive_arcus_live_tick_events.sh"
      - "scripts/test_install_arcus_live_tick_event_archive.sh"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-arcus-live-tick-event-archive.yml"
      - "deploy/archive-arcus-live-tick-events.service"
      - "deploy/archive-arcus-live-tick-events.timer"
      - "scripts/archive_arcus_live_tick_events.sh"
      - "scripts/arcus_live_tick_event_stream.py"
      - "scripts/install_arcus_live_tick_event_archive.sh"
      - "scripts/test_archive_arcus_live_tick_events.sh"
      - "scripts/test_install_arcus_live_tick_event_archive.sh"
  workflow_dispatch:

concurrency:
  group: arcus-live-tick-event-archive
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  ARCUS_INSTANCE_ID: i-0cb942c2950be020f
  RELEASE_PREFIX: arcus-spot-execute-once/event-archive
  PROVENANCE_DIR: /usr/local/share/arcus-live-tick-event-archive

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate archive bundle
        run: |
          set -euo pipefail
          bash -n scripts/archive_arcus_live_tick_events.sh scripts/install_arcus_live_tick_event_archive.sh scripts/test_archive_arcus_live_tick_events.sh scripts/test_install_arcus_live_tick_event_archive.sh
          python3 -m py_compile scripts/arcus_live_tick_event_stream.py scripts/arcus_live_tick_signal_replay.py
          python3 scripts/test_arcus_live_tick_event_stream.py -v
          bash scripts/test_archive_arcus_live_tick_events.sh
          bash scripts/test_install_arcus_live_tick_event_archive.sh
          sudo install -D -m 0755 scripts/archive_arcus_live_tick_events.sh /usr/local/libexec/debot/archive_arcus_live_tick_events.sh
          sudo install -D -m 0755 scripts/arcus_live_tick_event_stream.py /usr/local/libexec/debot/arcus_live_tick_event_stream.py
          systemd-analyze verify deploy/archive-arcus-live-tick-events.service deploy/archive-arcus-live-tick-events.timer

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    environment: debot
    steps:
      - uses: actions/checkout@v5
      - name: Package immutable archive release
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0644 deploy/archive-arcus-live-tick-events.service dist/
          install -m 0644 deploy/archive-arcus-live-tick-events.timer dist/
          install -m 0755 scripts/archive_arcus_live_tick_events.sh dist/
          install -m 0755 scripts/arcus_live_tick_event_stream.py dist/
          install -m 0755 scripts/install_arcus_live_tick_event_archive.sh dist/
          SERVICE_SHA=$(sha256sum dist/archive-arcus-live-tick-events.service | cut -d ' ' -f1)
          TIMER_SHA=$(sha256sum dist/archive-arcus-live-tick-events.timer | cut -d ' ' -f1)
          ARCHIVER_SHA=$(sha256sum dist/archive_arcus_live_tick_events.sh | cut -d ' ' -f1)
          VERIFIER_SHA=$(sha256sum dist/arcus_live_tick_event_stream.py | cut -d ' ' -f1)
          INSTALLER_SHA=$(sha256sum dist/install_arcus_live_tick_event_archive.sh | cut -d ' ' -f1)
          BUNDLE_SHA=$(printf '%s\n' "$SERVICE_SHA" "$TIMER_SHA" "$ARCHIVER_SHA" "$VERIFIER_SHA" "$INSTALLER_SHA" | sha256sum | cut -d ' ' -f1)
          jq -n --arg pairtrade_sha "$GITHUB_SHA" --arg bundle_sha256 "$BUNDLE_SHA" --arg github_run_id "$GITHUB_RUN_ID" --arg github_run_attempt "$GITHUB_RUN_ATTEMPT" '{schema_version: 1, artifact: "arcus-live-tick-event-archive", pairtrade_sha: $pairtrade_sha, bundle_sha256: $bundle_sha256, github_run_id: $github_run_id, github_run_attempt: $github_run_attempt, runtime_storage: {bucket: "debot-dashboard", prefix: "arcus-archive/live-tick-events/debot-arcus", private: true, current_version_retention: "indefinite", noncurrent_version_retention_days: 90}}' > dist/manifest.json
          FILES=(archive-arcus-live-tick-events.service archive-arcus-live-tick-events.timer archive_arcus_live_tick_events.sh arcus_live_tick_event_stream.py install_arcus_live_tick_event_archive.sh manifest.json)
          (cd dist && sha256sum "${FILES[@]}" > release.sha256)
          RELEASE_SHA=$(sha256sum dist/release.sha256 | cut -d ' ' -f1)
          RELEASE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$BUNDLE_SHA"
          RELEASE_KEY="$RELEASE_PREFIX/releases/$GITHUB_SHA/$BUNDLE_SHA/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "release_sha256=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "release_key=$RELEASE_KEY" >> "$GITHUB_OUTPUT"
          jq . dist/manifest.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload immutable archive release
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
          RELEASE_KEY: ${{ steps.package.outputs.release_key }}
        run: |
          set -euo pipefail
          FILES=(archive-arcus-live-tick-events.service archive-arcus-live-tick-events.timer archive_arcus_live_tick_events.sh arcus_live_tick_event_stream.py install_arcus_live_tick_event_archive.sh manifest.json release.sha256)
          for file in "${FILES[@]}"; do
            aws s3 cp --only-show-errors "dist/$file" "s3://$S3_BUCKET/$RELEASE_KEY/$file"
          done

      - name: Install and enable archive timer via SSM
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
          RELEASE_KEY: ${{ steps.package.outputs.release_key }}
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
          RELEASE_SHA256: ${{ steps.package.outputs.release_sha256 }}
        run: |
          set -euo pipefail
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "set -eu",
              "ARCUS_STAGE=$(mktemp -d /tmp/arcus-event-archive.XXXXXX)",
              "trap 'rm -rf \"$ARCUS_STAGE\"' EXIT",
              "for file in archive-arcus-live-tick-events.service archive-arcus-live-tick-events.timer archive_arcus_live_tick_events.sh arcus_live_tick_event_stream.py install_arcus_live_tick_event_archive.sh manifest.json release.sha256; do aws s3 cp --only-show-errors s3://__S3_BUCKET__/__RELEASE_KEY__/$file \"$ARCUS_STAGE/$file\"; done",
              "echo \"__RELEASE_SHA256__  $ARCUS_STAGE/release.sha256\" | sha256sum -c -",
              "aws s3api put-object help | grep -F -- '--if-none-match' >/dev/null",
              "chmod 0755 \"$ARCUS_STAGE/install_arcus_live_tick_event_archive.sh\"",
              "sudo env PROVENANCE_DIR=__PROVENANCE_DIR__ bash \"$ARCUS_STAGE/install_arcus_live_tick_event_archive.sh\" \"$ARCUS_STAGE\" __RELEASE_ID__"
            ],
            "executionTimeout": ["300"]
          }
          JSON
          sed -i -e "s|__S3_BUCKET__|$S3_BUCKET|g" -e "s|__RELEASE_KEY__|$RELEASE_KEY|g" -e "s|__RELEASE_SHA256__|$RELEASE_SHA256|g" -e "s|__PROVENANCE_DIR__|$PROVENANCE_DIR|g" -e "s|__RELEASE_ID__|$RELEASE_ID|g" /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command --instance-ids "$ARCUS_INSTANCE_ID" --document-name AWS-RunShellScript --comment "Enable durable Arcus event archive; do not invoke trading executor (#825)" --parameters file:///tmp/ssm-params.json --timeout-seconds 120 --query Command.CommandId --output text)
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$ARCUS_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$ARCUS_INSTANCE_ID" --output text
                exit 0
                ;;
              Cancelled|Cancelling|TimedOut|Failed)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$ARCUS_INSTANCE_ID" --output text || true
                echo "::error::archive installation failed with status $STATUS"
                exit 1
                ;;
              Pending|InProgress|Delayed) ;;
              *) echo "Unexpected SSM status: $STATUS" ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::archive installation polling timed out"
              exit 1
            fi
            sleep 15
          done
