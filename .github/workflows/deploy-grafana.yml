name: Deploy Grafana Dashboards

on:
  push:
    branches: [master, main]
    paths:
      - "grafana/**.json"
      - ".github/workflows/deploy-grafana.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-grafana:
    runs-on: ubuntu-latest
    environment: debot
    env:
      GRAFANA_ALERT_API_TOKEN: ${{ secrets.GRAFANA_ALERT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Push dashboards to Grafana
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GRAFANA_URL}" ] || [ -z "${GRAFANA_API_TOKEN}" ]; then
            echo "::error::GRAFANA_URL or GRAFANA_API_TOKEN secret is not set in the 'debot' environment"
            exit 1
          fi
          shopt -s nullglob
          files=(grafana/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No dashboards under grafana/ — nothing to do"
            exit 0
          fi
          for f in "${files[@]}"; do
            uid=$(jq -r '.uid // empty' "$f")
            title=$(jq -r '.title // "(untitled)"' "$f")
            if [ -z "$uid" ]; then
              echo "::error file=$f::dashboard JSON is missing a top-level uid"
              exit 1
            fi
            echo "::group::Deploying $f (uid=$uid, title=$title)"
            payload=$(jq \
              --arg msg "ci: deploy ${COMMIT_SHA}" \
              '{dashboard: (. + {id: null}), overwrite: true, message: $msg}' \
              "$f")
            http_status=$(curl -sS -o /tmp/grafana_resp.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GRAFANA_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "${GRAFANA_URL%/}/api/dashboards/db")
            cat /tmp/grafana_resp.json
            echo
            if [ "$http_status" != "200" ]; then
              echo "::error file=$f::Grafana API returned HTTP $http_status"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Alert provisioning token is not configured
        if: ${{ env.GRAFANA_ALERT_API_TOKEN == '' }}
        run: echo "::warning::GRAFANA_ALERT_API_TOKEN is not set; dashboard deployed but alert rules were not provisioned"

      - name: Push alert rules to Grafana
        if: ${{ env.GRAFANA_ALERT_API_TOKEN != '' }}
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GRAFANA_ALERT_API_TOKEN}")

          datasources=$(curl -fsS "${auth[@]}" "${GRAFANA_URL%/}/api/datasources")
          prom_uid=$(jq -r '([.[] | select(.type == "prometheus" and .isDefault == true)][0] // [.[] | select(.type == "prometheus")][0]).uid // empty' <<<"$datasources")
          if [ -z "$prom_uid" ]; then
            echo "::error::No Prometheus datasource found"
            exit 1
          fi

          folder_status=$(curl -sS -o /tmp/grafana_folder.json -w '%{http_code}' \
            "${auth[@]}" "${GRAFANA_URL%/}/api/folders/bot-alerts")
          if [ "$folder_status" = "404" ]; then
            curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/json" \
              --data '{"uid":"bot-alerts","title":"Bot alerts"}' \
              "${GRAFANA_URL%/}/api/folders" >/dev/null
          elif [ "$folder_status" != "200" ]; then
            cat /tmp/grafana_folder.json
            echo "::error::Grafana folder lookup returned HTTP $folder_status"
            exit 1
          fi

          shopt -s nullglob
          files=(grafana/alerts/*.json)
          for f in "${files[@]}"; do
            jq -c '.[]' "$f" | while IFS= read -r rule; do
              uid=$(jq -r '.uid' <<<"$rule")
              payload=$(jq --arg ds "$prom_uid" '
                (.data[] | select(.datasourceUid == "__PROMETHEUS_UID__") | .datasourceUid) = $ds
              ' <<<"$rule")
              get_status=$(curl -sS -o /tmp/grafana_rule.json -w '%{http_code}' \
                "${auth[@]}" "${GRAFANA_URL%/}/api/v1/provisioning/alert-rules/${uid}")
              if [ "$get_status" = "200" ]; then
                method=PUT
                endpoint="/api/v1/provisioning/alert-rules/${uid}"
                expected=200
              elif [ "$get_status" = "404" ]; then
                method=POST
                endpoint="/api/v1/provisioning/alert-rules"
                expected=201
              else
                cat /tmp/grafana_rule.json
                echo "::error::Grafana alert lookup for $uid returned HTTP $get_status"
                exit 1
              fi
              status=$(curl -sS -o /tmp/grafana_rule.json -w '%{http_code}' \
                -X "$method" "${auth[@]}" -H "Content-Type: application/json" \
                --data "$payload" "${GRAFANA_URL%/}${endpoint}")
              cat /tmp/grafana_rule.json
              echo
              if [ "$status" != "$expected" ]; then
                echo "::error file=$f::Grafana alert upsert for $uid returned HTTP $status"
                exit 1
              fi
            done
          done

          # Prune: delete any provisioned rule in the bot-alerts folder whose
          # UID is no longer present in grafana/alerts/*.json. The upsert loop
          # above runs first, so every desired rule already exists before we
          # prune. Without this, rules removed from the repo (e.g. the retired
          # xvenue-arb rules in #559) linger in Grafana forever — the upsert
          # loop only ever creates/updates, never deletes. Scoped to
          # folderUID == bot-alerts so unrelated folders are untouched.
          desired_uids=$(jq -r '.[].uid' grafana/alerts/*.json | sort -u)
          all_rules=$(curl -fsS "${auth[@]}" "${GRAFANA_URL%/}/api/v1/provisioning/alert-rules")
          existing_uids=$(jq -r '.[] | select(.folderUID == "bot-alerts") | .uid' <<<"$all_rules")
          for uid in $existing_uids; do
            if ! grep -qxF "$uid" <<<"$desired_uids"; then
              echo "Pruning alert rule $uid (no longer in repo)"
              del_status=$(curl -sS -o /tmp/grafana_rule.json -w '%{http_code}' \
                -X DELETE "${auth[@]}" \
                "${GRAFANA_URL%/}/api/v1/provisioning/alert-rules/${uid}")
              if [ "$del_status" != "204" ]; then
                cat /tmp/grafana_rule.json
                echo "::error::Grafana alert delete for $uid returned HTTP $del_status"
                exit 1
              fi
            fi
          done
