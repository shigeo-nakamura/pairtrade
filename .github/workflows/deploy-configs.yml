name: Deploy Configs

on:
  push:
    paths:
      - ".github/fixtures/**"
      - ".github/workflows/deploy-configs.yml"
      - "configs/**"
      - "scripts/**"
      - "deploy/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-configs-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  INSTALL_DIR: /opt/debot

jobs:
  validate-config-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Validate shell wrappers
        run: |
          bash -n debot/scripts/debot-bull-holder.sh
          bash -n debot/scripts/engine_b_phase0_archive.sh
          bash -n debot/scripts/install_engine_b_phase0.sh
          bash -n debot/scripts/run_engine_b_phase0.sh
          bash -n debot/scripts/install_engine_b_live.sh
          bash -n debot/scripts/install_book_runtime.sh
          bash -n debot/scripts/book_signal_fetch.sh
          bash -n debot/scripts/s3_object_present.sh
          python3 -m py_compile debot/scripts/xsmom_signal_producer.py debot/scripts/test_xsmom_signal_producer.py
          python3 -m py_compile debot/scripts/engine_b_phase0.py debot/scripts/test_engine_b_phase0.py
          python3 -m py_compile debot/scripts/engine_b_trading_calendar_freeze.py debot/scripts/test_engine_b_trading_calendar_freeze.py
          python3 -m py_compile debot/scripts/book_signal_file.py debot/scripts/test_book_signal_file.py
          python3 debot/scripts/test_book_signal_file.py
          python3 debot/scripts/test_xsmom_signal_producer.py
          bash debot/scripts/test_book_signal_fetch.sh
          bash debot/scripts/test_s3_object_present.sh

      - name: Test Engine B Phase 0 observer
        run: |
          python3 -m pip install -r debot/scripts/engine_b_phase0_requirements.txt
          python3 debot/scripts/test_engine_b_phase0.py
          bash debot/scripts/test_engine_b_phase0_archive.sh

      - name: Verify Engine B trading calendar freeze (A-7)
        run: |
          python3 -m pip install -r debot/scripts/engine_b_trading_calendar_freeze_requirements.txt
          python3 debot/scripts/test_engine_b_trading_calendar_freeze.py
          RANGE_START=$(python3 -c "import json; print(json.load(open('debot/configs/engine-b/trading_calendar.json'))['range']['start'])")
          RANGE_END=$(python3 -c "import json; print(json.load(open('debot/configs/engine-b/trading_calendar.json'))['range']['end'])")
          python3 debot/scripts/engine_b_trading_calendar_freeze.py \
            --start "$RANGE_START" --end "$RANGE_END" --out /tmp/trading_calendar_check.json
          diff debot/configs/engine-b/trading_calendar.json /tmp/trading_calendar_check.json

      - name: Validate systemd units
        # engine-b-live.service is not verified here: its ExecStart points
        # at the on-host install path, which systemd-analyze on the runner
        # reports as "not executable" (same reason it was never listed).
        run: |
          systemd-analyze verify debot/deploy/engine-b-phase0.service
          systemd-analyze verify debot/deploy/engine-b-phase0-archive.service
          systemd-analyze verify debot/deploy/engine-b-phase0-archive.timer
          systemd-analyze verify debot/deploy/book-signal-fetch-xsmom-695.timer

  deploy-configs:
    needs: validate-config-artifacts
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
    environment: debot
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Forbid bot auto-restart in CI workflows
        # bot-strategy#269: trading services are restarted manually only.
        # Keep this regex aligned with the matching guard in `ci.yml`.
        run: |
          if grep -nE 'systemctl[[:space:]]+(restart|start)[[:space:]]+(debot-pair-[a-z-]+|engine-b-live|debot-bull-holder|book-runtime-[a-z0-9-]+)([[:space:]]|$)' debot/.github/workflows/*.yml; then
            echo "::error::CI workflow contains a forbidden 'systemctl restart/start <trading unit>' — trading services must be restarted manually only (bot-strategy#269)."
            exit 1
          fi

      - name: Package artifacts
        run: |
          mkdir -p dist/scripts dist/configs
          rsync -a \
            --exclude "venv/" \
            --exclude "__pycache__/" \
            --exclude "*.log" \
            --exclude "*.pyc" \
            debot/scripts/ dist/scripts/
          rsync -a debot/configs/ dist/configs/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifacts to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          # Env files are intentionally NOT in the repo (per-variant *.env
          # carry Lighter wallet KMS keys; debot.env is currently secret-free
          # but the policy is "no env files in git" to keep operator review
          # mandatory before any secret enters the repo). Excluding them from
          # the upload prevents an empty/stale dist tree from racing the
          # host-managed copies. See bot-strategy#357.
          aws s3 sync dist/scripts/ "s3://${S3_BUCKET}/debot/scripts/" \
            --exact-timestamps \
            --exclude "venv/*" \
            --exclude "venv/**" \
            --exclude "__pycache__/*" \
            --exclude "__pycache__/**" \
            --exclude "*.log" \
            --exclude "*.pyc" \
            --exclude "*.env"
          aws s3 sync dist/configs/ "s3://${S3_BUCKET}/debot/configs/" --exact-timestamps
          aws s3 cp debot/deploy/engine-b-live.service "s3://${S3_BUCKET}/deploy/engine-b-live.service"
          aws s3 cp debot/deploy/engine-b-phase0.service "s3://${S3_BUCKET}/deploy/engine-b-phase0.service"
          aws s3 cp debot/deploy/engine-b-phase0-archive.service "s3://${S3_BUCKET}/deploy/engine-b-phase0-archive.service"
          aws s3 cp debot/deploy/engine-b-phase0-archive.timer "s3://${S3_BUCKET}/deploy/engine-b-phase0-archive.timer"
          for u in book-runtime-xsmom-695.service book-signal-fetch-xsmom-695.service book-signal-fetch-xsmom-695.timer; do
            aws s3 cp "debot/deploy/$u" "s3://${S3_BUCKET}/deploy/$u"
          done
          ENGINE_B_PREFIX="debot/engine-b-phase0/releases/${GITHUB_SHA}"
          aws s3 cp debot/scripts/engine_b_phase0.py "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/scripts/engine_b_phase0.py"
          aws s3 cp debot/scripts/engine_b_phase0_archive.sh "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/scripts/engine_b_phase0_archive.sh"
          aws s3 cp debot/scripts/engine_b_phase0_requirements.txt "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/scripts/engine_b_phase0_requirements.txt"
          aws s3 cp debot/scripts/install_engine_b_phase0.sh "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/scripts/install_engine_b_phase0.sh"
          aws s3 cp debot/configs/engine-b/phase0.json "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/configs/phase0.json"
          aws s3 cp debot/configs/engine-b/trading_calendar.json "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/configs/trading_calendar.json"
          aws s3 cp debot/deploy/engine-b-phase0.service "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/deploy/engine-b-phase0.service"
          aws s3 cp debot/deploy/engine-b-phase0-archive.service "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/deploy/engine-b-phase0-archive.service"
          aws s3 cp debot/deploy/engine-b-phase0-archive.timer "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/deploy/engine-b-phase0-archive.timer"

      - name: Deploy scripts/configs to Frankfurt via SSM (no restart)
        # Frankfurt (bot-strategy#937 sunset) only hosts debot-bull-holder,
        # whose launcher reads /opt/debot/scripts/debot-bull-holder.env;
        # this step keeps the shared scripts/configs tree in sync and does
        # nothing else. Unit files are owned by deploy-bull-holder.yml.
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
          INSTANCE_ID: ${{ secrets.INSTANCE_ID || vars.INSTANCE_ID }}
        run: |
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "sudo mkdir -p __INSTALL_DIR__/scripts __INSTALL_DIR__/configs",
              "aws s3 sync s3://__S3_BUCKET__/debot/scripts __INSTALL_DIR__/scripts --exact-timestamps --exclude '*.env'",
              "aws s3 sync s3://__S3_BUCKET__/debot/configs __INSTALL_DIR__/configs --exact-timestamps",
              "sudo chmod 755 __INSTALL_DIR__/scripts/*.sh"
            ]
          }
          JSON
          sed -i "s|__INSTALL_DIR__|${INSTALL_DIR}|g; s|__S3_BUCKET__|${S3_BUCKET}|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy debot configs/scripts" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          set +e
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
          WAIT_STATUS=$?
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
          set -e
          if [ $WAIT_STATUS -ne 0 ]; then
            echo "SSM command failed with status ${WAIT_STATUS}" >&2
            exit $WAIT_STATUS
          fi

  deploy-robinhood-configs:
    name: Deploy configs to Robinhood Lighter host
    needs: deploy-configs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: debot
    env:
      AWS_REGION: ap-northeast-1
      INSTALL_DIR: /opt/debot
      INSTANCE_ID: ${{ vars.ROBINHOOD_LIGHTER_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy config and runtime files via SSM (no start/restart)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          test -n "${INSTANCE_ID}"
          # A single shorthand `--parameters commands="cmd1,cmd2,..."` string
          # is fragile here: AWS CLI's shorthand parser can misparse a
          # `KEY=value` pattern embedded after whitespace inside one comma-
          # separated command (e.g. `sudo env ENGINE_B_PHASE0_CODE_COMMIT=...`)
          # as the start of a new top-level parameter, breaking with
          # "Expected: '=', received: ...". A `--parameters file://` JSON
          # array (as the "Deploy via SSM (no restart)" step above already
          # uses) avoids that ambiguity entirely; each command is its own
          # JSON string, quoted, no shorthand involved.
          # The frozen Robinhood Chain pairtrade service on this host
          # (`debot-pair-robinhood-lighter`) is deliberately NOT touched:
          # its config and units stay as last deployed (bot-strategy#937).
          cat > /tmp/ssm-robinhood-params.json <<'JSON'
          {
            "commands": [
              "set -e",
              "sudo install -d -o ec2-user -g ec2-user -m 0750 __INSTALL_DIR__ __INSTALL_DIR__/scripts __INSTALL_DIR__/configs",
              "aws s3 sync s3://__S3_BUCKET__/debot/scripts __INSTALL_DIR__/scripts --exclude '*.env'",
              "aws s3 sync s3://__S3_BUCKET__/debot/configs __INSTALL_DIR__/configs",
              "sudo chmod 755 __INSTALL_DIR__/scripts/*.sh",
              "install -d -m 0755 /tmp/book-units-__GITHUB_SHA__",
              "for u in book-runtime-xsmom-695.service book-signal-fetch-xsmom-695.service book-signal-fetch-xsmom-695.timer; do aws s3 cp s3://__S3_BUCKET__/deploy/$u /tmp/book-units-__GITHUB_SHA__/$u; done",
              "# Both install paths stage everything from S3 into a per-run dir, so neither depends on the other having run first: ci.yml owns the binary object, this job owns the config and unit objects, and whichever installs last promotes the newest of both under install_book_runtime.sh's flock.",
              "install -d -m 0755 /tmp/engine-b-phase0-__GITHUB_SHA__",
              "aws s3 sync s3://__S3_BUCKET__/debot/engine-b-phase0/releases/__GITHUB_SHA__/ /tmp/engine-b-phase0-__GITHUB_SHA__/ --exact-timestamps",
              "/bin/bash -lc 'set -e; bash __INSTALL_DIR__/scripts/s3_object_present.sh __S3_BUCKET__ debot/book_runtime; rc=$?; if [ $rc -eq 10 ]; then echo \"book runtime binary not published to S3 yet (ci.yml uploads it); skipping\"; elif [ $rc -ne 0 ]; then exit $rc; else aws s3 cp s3://__S3_BUCKET__/debot/book_runtime /tmp/book-units-__GITHUB_SHA__/book_runtime; aws s3 cp s3://__S3_BUCKET__/debot/libsigner.so /tmp/book-units-__GITHUB_SHA__/libsigner.so; sudo env BOOK_INSTANCE=xsmom-695 BOOK_BINARY_SOURCE=/tmp/book-units-__GITHUB_SHA__/book_runtime BOOK_LIBSIGNER_SOURCE=/tmp/book-units-__GITHUB_SHA__/libsigner.so BOOK_UNIT_SOURCE_DIR=/tmp/book-units-__GITHUB_SHA__ bash __INSTALL_DIR__/scripts/install_book_runtime.sh; fi'",
              "sudo env ENGINE_B_PHASE0_CODE_COMMIT=__GITHUB_SHA__ ENGINE_B_PHASE0_REQUIREMENTS=/tmp/engine-b-phase0-__GITHUB_SHA__/scripts/engine_b_phase0_requirements.txt ENGINE_B_PHASE0_OBSERVER_SOURCE=/tmp/engine-b-phase0-__GITHUB_SHA__/scripts/engine_b_phase0.py ENGINE_B_PHASE0_ARCHIVER_SOURCE=/tmp/engine-b-phase0-__GITHUB_SHA__/scripts/engine_b_phase0_archive.sh ENGINE_B_PHASE0_CONFIG_SOURCE=/tmp/engine-b-phase0-__GITHUB_SHA__/configs/phase0.json ENGINE_B_PHASE0_CALENDAR_SOURCE=/tmp/engine-b-phase0-__GITHUB_SHA__/configs/trading_calendar.json ENGINE_B_PHASE0_UNIT_SOURCE_DIR=/tmp/engine-b-phase0-__GITHUB_SHA__/deploy bash /tmp/engine-b-phase0-__GITHUB_SHA__/scripts/install_engine_b_phase0.sh"
            ]
          }
          JSON
          sed -i "s|__INSTALL_DIR__|${INSTALL_DIR}|g; s|__S3_BUCKET__|${S3_BUCKET}|g; s|__GITHUB_SHA__|${GITHUB_SHA}|g" /tmp/ssm-robinhood-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Engine B Phase 0 artifacts; no start or restart" \
            --parameters file:///tmp/ssm-robinhood-params.json \
            --query Command.CommandId --output text)
          set +e
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
          WAIT_STATUS=$?
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
          set -e
          if [ ${WAIT_STATUS} -ne 0 ]; then
            exit ${WAIT_STATUS}
          fi
