name: Deploy Configs

on:
  push:
    paths:
      - ".github/fixtures/**"
      - ".github/workflows/deploy-configs.yml"
      - "configs/**"
      - "scripts/**"
      - "deploy/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-configs-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  INSTALL_DIR: /opt/debot

jobs:
  validate-config-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Validate shell wrappers
        run: |
          bash -n debot/scripts/debot-pair-shadow-macro.sh
          bash -n debot/scripts/debot-pair-robinhood-lighter.sh
          bash -n debot/scripts/bootstrap-robinhood-sidecar.sh
          bash -n debot/scripts/activate-robinhood-sidecar.sh
          bash -n debot/scripts/deploy-robinhood-config.sh
          bash -n debot/scripts/deploy-robinhood-runtime.sh
          bash -n debot/scripts/engine_b_phase0_archive.sh
          bash -n debot/scripts/install_engine_b_phase0.sh
          bash -n debot/scripts/run_engine_b_phase0.sh
          bash -n debot/scripts/test_bootstrap_robinhood_sidecar.sh
          bash -n debot/scripts/test_deploy_robinhood_runtime.sh
          python3 -m py_compile debot/scripts/test_robinhood_deploy_workflows.py
          python3 -m py_compile debot/scripts/engine_b_phase0.py debot/scripts/test_engine_b_phase0.py
          python3 -m py_compile debot/scripts/engine_b_trading_calendar_freeze.py debot/scripts/test_engine_b_trading_calendar_freeze.py

      - name: Test Engine B Phase 0 observer
        run: |
          python3 -m pip install -r debot/scripts/engine_b_phase0_requirements.txt
          python3 debot/scripts/test_engine_b_phase0.py
          bash debot/scripts/test_engine_b_phase0_archive.sh

      - name: Verify Engine B trading calendar freeze (A-7)
        run: |
          python3 -m pip install -r debot/scripts/engine_b_trading_calendar_freeze_requirements.txt
          python3 debot/scripts/test_engine_b_trading_calendar_freeze.py
          RANGE_START=$(python3 -c "import json; print(json.load(open('debot/configs/engine-b/trading_calendar.json'))['range']['start'])")
          RANGE_END=$(python3 -c "import json; print(json.load(open('debot/configs/engine-b/trading_calendar.json'))['range']['end'])")
          python3 debot/scripts/engine_b_trading_calendar_freeze.py \
            --start "$RANGE_START" --end "$RANGE_END" --out /tmp/trading_calendar_check.json
          diff debot/configs/engine-b/trading_calendar.json /tmp/trading_calendar_check.json

      - name: Test Robinhood sidecar bootstrap
        run: bash debot/scripts/test_bootstrap_robinhood_sidecar.sh

      - name: Test Robinhood runtime staging
        run: bash debot/scripts/test_deploy_robinhood_runtime.sh

      - name: Verify Robinhood deploy workflow isolation
        run: python3 debot/scripts/test_robinhood_deploy_workflows.py

      - name: Validate Robinhood systemd units
        run: |
          systemd-analyze verify debot/deploy/debot-pair-robinhood-sidecar-activation.service
          systemd-analyze verify debot/deploy/debot-pair-robinhood-lighter.service
          systemd-analyze verify debot/deploy/engine-b-phase0.service
          systemd-analyze verify debot/deploy/engine-b-phase0-archive.service
          systemd-analyze verify debot/deploy/engine-b-phase0-archive.timer

      - name: Validate Lighter market preflight
        run: |
          python3 -m py_compile debot/scripts/check_lighter_config_markets.py
          python3 debot/scripts/check_lighter_config_markets.py \
            debot/configs/pairtrade/debot-pair-shadow-macro.yaml \
            --markets-json debot/.github/fixtures/lighter_order_book_details_macro.json

  deploy-configs:
    needs: validate-config-artifacts
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
    environment: debot
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Forbid bot auto-restart in CI workflows
        # bot-strategy#269: main trading bots (debot-pair-btceth,
        # debot-pair-btceth-extended) must be restarted manually only.
        # Auto-restart from CI force-closes open positions inside systemd's
        # 90s TimeoutStopSec window. Sidecar `lighter-ratelimit` is exempt
        # and intentionally not matched.
        # bot-strategy#376 exception: debot-pair-canary is the only
        # debot-pair-* unit allowed to auto-restart on every deploy. Keep
        # this regex aligned with the matching guard in `ci.yml`.
        run: |
          if grep -nE 'systemctl[[:space:]]+(restart|start)[[:space:]]+debot-pair-(btceth|extended)([[:space:]]|$)' debot/.github/workflows/*.yml; then
            echo "::error::CI workflow contains forbidden 'systemctl restart/start debot-pair-(btceth|extended)' — main bots must be restarted manually only (bot-strategy#269). Canary (debot-pair-canary) is the only exception."
            exit 1
          fi

      - name: Package artifacts
        run: |
          mkdir -p dist/scripts dist/configs
          rsync -a \
            --exclude "venv/" \
            --exclude "__pycache__/" \
            --exclude "*.log" \
            --exclude "*.pyc" \
            debot/scripts/ dist/scripts/
          rsync -a debot/configs/ dist/configs/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifacts to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          # Env files are intentionally NOT in the repo (per-variant *.env
          # carry Lighter wallet KMS keys; debot.env is currently secret-free
          # but the policy is "no env files in git" to keep operator review
          # mandatory before any secret enters the repo). Excluding them from
          # the upload prevents an empty/stale dist tree from racing the
          # host-managed copies. See bot-strategy#357.
          aws s3 sync dist/scripts/ "s3://${S3_BUCKET}/debot/scripts/" \
            --exact-timestamps \
            --exclude "venv/*" \
            --exclude "venv/**" \
            --exclude "__pycache__/*" \
            --exclude "__pycache__/**" \
            --exclude "*.log" \
            --exclude "*.pyc" \
            --exclude "*.env"
          aws s3 sync dist/configs/ "s3://${S3_BUCKET}/debot/configs/" --exact-timestamps
          aws s3 cp debot/deploy/debot-pair-btceth.service "s3://${S3_BUCKET}/deploy/debot-pair-btceth.service"
          aws s3 cp debot/deploy/pair-data-collector.service "s3://${S3_BUCKET}/deploy/pair-data-collector.service"
          aws s3 cp debot/deploy/debot-pair-shadow.service "s3://${S3_BUCKET}/deploy/debot-pair-shadow.service"
          aws s3 cp debot/deploy/debot-pair-shadow-macro.service "s3://${S3_BUCKET}/deploy/debot-pair-shadow-macro.service"
          aws s3 cp debot/deploy/debot-pair-robinhood-sidecar-activation.service "s3://${S3_BUCKET}/deploy/debot-pair-robinhood-sidecar-activation.service"
          aws s3 cp debot/deploy/debot-pair-robinhood-lighter.service "s3://${S3_BUCKET}/deploy/debot-pair-robinhood-lighter.service"
          aws s3 cp debot/deploy/engine-b-phase0.service "s3://${S3_BUCKET}/deploy/engine-b-phase0.service"
          aws s3 cp debot/deploy/engine-b-phase0-archive.service "s3://${S3_BUCKET}/deploy/engine-b-phase0-archive.service"
          aws s3 cp debot/deploy/engine-b-phase0-archive.timer "s3://${S3_BUCKET}/deploy/engine-b-phase0-archive.timer"
          ENGINE_B_PREFIX="debot/engine-b-phase0/releases/${GITHUB_SHA}"
          aws s3 cp debot/scripts/engine_b_phase0.py "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/scripts/engine_b_phase0.py"
          aws s3 cp debot/scripts/engine_b_phase0_archive.sh "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/scripts/engine_b_phase0_archive.sh"
          aws s3 cp debot/scripts/engine_b_phase0_requirements.txt "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/scripts/engine_b_phase0_requirements.txt"
          aws s3 cp debot/scripts/install_engine_b_phase0.sh "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/scripts/install_engine_b_phase0.sh"
          aws s3 cp debot/configs/engine-b/phase0.json "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/configs/phase0.json"
          aws s3 cp debot/configs/engine-b/trading_calendar.json "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/configs/trading_calendar.json"
          aws s3 cp debot/deploy/engine-b-phase0.service "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/deploy/engine-b-phase0.service"
          aws s3 cp debot/deploy/engine-b-phase0-archive.service "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/deploy/engine-b-phase0-archive.service"
          aws s3 cp debot/deploy/engine-b-phase0-archive.timer "s3://${S3_BUCKET}/${ENGINE_B_PREFIX}/deploy/engine-b-phase0-archive.timer"

      - name: Deploy via SSM (no restart)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
          INSTANCE_ID: ${{ secrets.INSTANCE_ID || vars.INSTANCE_ID }}
        run: |
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "sudo mkdir -p __INSTALL_DIR__/scripts __INSTALL_DIR__/configs",
              "aws s3 sync s3://__S3_BUCKET__/debot/scripts __INSTALL_DIR__/scripts --exact-timestamps --exclude '*.env'",
              "/bin/bash -lc 'set -e; CFG_OUT=$(aws s3 sync s3://__S3_BUCKET__/debot/configs __INSTALL_DIR__/configs --exact-timestamps); printf \"%s\\n\" \"$CFG_OUT\"; CHANGED=$(printf \"%s\\n\" \"$CFG_OUT\" | grep -E \"to .*/configs/pairtrade/debot-pair-btceth[.]yaml$\" | sed -E \"s/.* to //\" | sort -u || true); if [ -n \"$CHANGED\" ]; then { echo \"deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)\"; echo \"changed:\"; printf \"%s\\n\" \"$CHANGED\"; echo \"ACTION: bot-strategy#269 deploy is no-restart. Restart the affected service to LOAD this config, then verify with scripts/check_config_drift.sh (the [CONFIG] fingerprint at startup confirms what loaded).\"; } | sudo tee __INSTALL_DIR__/RESTART_PENDING >/dev/null; echo \"WARNING RESTART REQUIRED: pairtrade config changed but the running process was NOT restarted (deploy != restart, bot-strategy#269/#580). RESTART_PENDING marker dropped:\"; printf \"%s\\n\" \"$CHANGED\"; fi; if [ -f __INSTALL_DIR__/RESTART_PENDING ]; then echo \"NOTE: __INSTALL_DIR__/RESTART_PENDING still present from a prior config deploy — a restart+load is still owed (cleared only by the service launch script on restart).\"; fi'",
              "sudo chmod 755 __INSTALL_DIR__/scripts/*.sh",
              "/bin/bash -lc 'set -e; UPDATED=0; for svc in debot-pair-btceth pair-data-collector debot-pair-shadow debot-pair-shadow-macro; do aws s3 cp s3://__S3_BUCKET__/deploy/$svc.service /tmp/$svc.service; if [ ! -f /etc/systemd/system/$svc.service ] || ! cmp -s /etc/systemd/system/$svc.service /tmp/$svc.service; then sudo mv /tmp/$svc.service /etc/systemd/system/$svc.service; UPDATED=1; else rm /tmp/$svc.service; fi; done; if [ $UPDATED -eq 1 ]; then sudo systemctl daemon-reload; fi'"
            ]
          }
          JSON
          sed -i "s|__INSTALL_DIR__|${INSTALL_DIR}|g; s|__S3_BUCKET__|${S3_BUCKET}|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy debot configs/scripts" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          set +e
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
          WAIT_STATUS=$?
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
          set -e
          if [ $WAIT_STATUS -ne 0 ]; then
            echo "SSM command failed with status ${WAIT_STATUS}" >&2
            exit $WAIT_STATUS
          fi

  deploy-robinhood-configs:
    name: Deploy configs to Robinhood Lighter host
    needs: deploy-configs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: debot
    env:
      AWS_REGION: ap-northeast-1
      INSTALL_DIR: /opt/debot
      INSTANCE_ID: ${{ vars.ROBINHOOD_LIGHTER_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy config and runtime files via SSM (no start/restart)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          test -n "${INSTANCE_ID}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Robinhood Lighter pairtrade and Engine B artifacts; no start or restart" \
            --parameters commands="set -e,sudo install -d -o ec2-user -g ec2-user -m 0750 ${INSTALL_DIR} ${INSTALL_DIR}/scripts ${INSTALL_DIR}/configs ${INSTALL_DIR}/configs/pairtrade /opt/debot-robinhood-lighter /home/ec2-user/debot_status,aws s3 sync s3://${S3_BUCKET}/debot/scripts ${INSTALL_DIR}/scripts --exclude *.env,sudo bash ${INSTALL_DIR}/scripts/deploy-robinhood-config.sh ${S3_BUCKET} ${INSTALL_DIR},sudo chmod 755 ${INSTALL_DIR}/scripts/*.sh,install -d -m 0755 /tmp/engine-b-phase0-${GITHUB_SHA},aws s3 sync s3://${S3_BUCKET}/debot/engine-b-phase0/releases/${GITHUB_SHA}/ /tmp/engine-b-phase0-${GITHUB_SHA}/ --exact-timestamps,sudo env ENGINE_B_PHASE0_CODE_COMMIT=${GITHUB_SHA} ENGINE_B_PHASE0_REQUIREMENTS=/tmp/engine-b-phase0-${GITHUB_SHA}/scripts/engine_b_phase0_requirements.txt ENGINE_B_PHASE0_OBSERVER_SOURCE=/tmp/engine-b-phase0-${GITHUB_SHA}/scripts/engine_b_phase0.py ENGINE_B_PHASE0_ARCHIVER_SOURCE=/tmp/engine-b-phase0-${GITHUB_SHA}/scripts/engine_b_phase0_archive.sh ENGINE_B_PHASE0_CONFIG_SOURCE=/tmp/engine-b-phase0-${GITHUB_SHA}/configs/phase0.json ENGINE_B_PHASE0_CALENDAR_SOURCE=/tmp/engine-b-phase0-${GITHUB_SHA}/configs/trading_calendar.json ENGINE_B_PHASE0_UNIT_SOURCE_DIR=/tmp/engine-b-phase0-${GITHUB_SHA}/deploy bash /tmp/engine-b-phase0-${GITHUB_SHA}/scripts/install_engine_b_phase0.sh,aws s3 cp s3://${S3_BUCKET}/deploy/debot-pair-robinhood-sidecar-activation.service /tmp/debot-pair-robinhood-sidecar-activation.service,aws s3 cp s3://${S3_BUCKET}/deploy/debot-pair-robinhood-lighter.service /tmp/debot-pair-robinhood-lighter.service,sudo systemd-analyze verify /tmp/debot-pair-robinhood-sidecar-activation.service /tmp/debot-pair-robinhood-lighter.service,sudo mv /tmp/debot-pair-robinhood-sidecar-activation.service /etc/systemd/system/debot-pair-robinhood-sidecar-activation.service,sudo mv /tmp/debot-pair-robinhood-lighter.service /etc/systemd/system/debot-pair-robinhood-lighter.service,sudo systemctl daemon-reload,sudo chown -R ec2-user:ec2-user /opt/debot-robinhood-lighter /home/ec2-user/debot_status" \
            --query Command.CommandId --output text)
          set +e
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
          WAIT_STATUS=$?
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
          set -e
          if [ ${WAIT_STATUS} -ne 0 ]; then
            exit ${WAIT_STATUS}
          fi
