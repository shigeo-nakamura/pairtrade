name: xvenue hedge holder build (bot-strategy#1046)

# Build-only CI for src/bin/xvenue_hedge_holder.rs — the Robinhood-chain-
# long / Lighter-Core-short points hedge (bot-strategy#1046). Same shape as
# ci-robinhood-dipgrid.yml: no deploy step, no AWS credentials. The Tokyo
# Robinhood host has always been a manual SSM push (#798), and this bot
# goes live only after the pre-registered G0 readout on that issue, so the
# workflow produces the ARM64 artifact for that manual path and nothing
# else.
#
# ci.yml's build-test job already runs `cargo check/test --all-targets`
# on every src/** push (native x86_64), which covers this binary's unit
# tests. What is unique here is the ARM64 build on the AL2023 image
# (Tokyo's actual host) and the ready-to-copy artifact.

on:
  push:
    paths:
      - "src/bin/xvenue_hedge_holder.rs"
      - "src/config.rs"
      - "src/directional/**"
      - "src/trade/**"
      - "src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-xvenue-hedge-holder.yml"
  workflow_dispatch:
    inputs:
      dex_connector_ref:
        description: "Dex-connector ref/tag override (optional)"
        required: false
        type: string

concurrency:
  group: xvenue-hedge-holder-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIGHTER_GO_REF: v1.0.2
  AL2023_IMAGE: public.ecr.aws/amazonlinux/amazonlinux:2023
  RUST_TOOLCHAIN: 1.94.1

jobs:
  resolve-ref:
    # bot-strategy#899: shared with ci.yml / deploy-bull-holder.yml /
    # deploy-arcus-spot-executor.yml.
    uses: ./.github/workflows/_resolve-dex-connector-ref.yml
    with:
      input-ref: ${{ inputs.dex_connector_ref || '' }}

  check-native:
    needs: resolve-ref
    runs-on: ubuntu-latest
    env:
      DEX_CONNECTOR_REF: ${{ needs.resolve-ref.outputs.ref }}
      LIGHTER_GO_PATH: ${{ github.workspace }}/lighter-go
      LD_LIBRARY_PATH: ${{ github.workspace }}/lighter-go
    defaults:
      run:
        working-directory: debot
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ env.DEX_CONNECTOR_REF }}
          path: dex-connector
          token: ${{ secrets.DEX_CONNECTOR_PAT || github.token }}

      - name: Checkout lighter-go
        uses: actions/checkout@v5
        with:
          repository: elliottech/lighter-go
          ref: ${{ env.LIGHTER_GO_REF }}
          path: lighter-go

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: lighter-go/go.sum

      - name: Build libsigner
        run: go build -buildmode=c-shared -trimpath -o libsigner.so ./sharedlib
        working-directory: ${{ github.workspace }}/lighter-go

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            debot -> target

      - name: Cargo check (xvenue_hedge_holder only)
        run: cargo check --bin xvenue_hedge_holder --locked

      - name: Cargo test (xvenue_hedge_holder only)
        run: cargo test --bin xvenue_hedge_holder --locked

  # Native ARM64 runner, matching ci.yml's current deploy job (bot-strategy#805
  # migrated it off QEMU). An earlier version of this workflow copied the
  # since-superseded QEMU+ubuntu-latest pattern and genuinely timed out at
  # both 60min and 180min on a cold cache -- ci.yml's own comment now bounds
  # its equivalent native-arm64 release build at ~30min, which is what
  # motivated re-deriving this job from the current ci.yml instead.
  build-arm64:
    needs: [resolve-ref, check-native]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      DEX_CONNECTOR_REF: ${{ needs.resolve-ref.outputs.ref }}
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ env.DEX_CONNECTOR_REF }}
          path: dex-connector
          token: ${{ secrets.DEX_CONNECTOR_PAT || github.token }}

      - name: Checkout lighter-go
        uses: actions/checkout@v5
        with:
          repository: elliottech/lighter-go
          ref: ${{ env.LIGHTER_GO_REF }}
          path: lighter-go

      - name: Resolve build image
        id: build_image
        uses: ./debot/.github/actions/al2023-build-image
        with:
          image: ${{ env.AL2023_IMAGE }}

      - name: Build libsigner in AL2023 (native arm64)
        uses: ./debot/.github/actions/build-libsigner-al2023
        with:
          image-ref: ${{ steps.build_image.outputs.image_ref }}
          image-cache-key: ${{ steps.build_image.outputs.cache_key }}
          lighter-go-ref: ${{ env.LIGHTER_GO_REF }}

      - name: Cache cargo (native arm64, xvenue hedge)
        id: cache_cargo
        uses: actions/cache@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          # Distinct suffix from ci.yml's cargo-lighter-* keys: this builds
          # only the xvenue_hedge_holder bin target, not the full debot binary,
          # so target/ contents differ. restore-keys still falls back to
          # ci.yml's own warm cache for the shared dependency graph.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-xvenue-hedge-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-${{ hashFiles('debot/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-xvenue-hedge-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-lighter-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-

      - name: Build xvenue_hedge_holder in AL2023 (native arm64)
        id: build_hedge
        run: |
          mkdir -p .cache/cargo/registry .cache/cargo/git .cache/cargo/bin .cache/rustup debot/target
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_HOME=/workspace/.cache/cargo \
            -e RUSTUP_HOME=/workspace/.cache/rustup \
            -e CARGO_INCREMENTAL=0 \
            -e LIGHTER_GO_PATH=/workspace/lighter-go/build \
            -e LD_LIBRARY_PATH=/workspace/lighter-go/build \
            ${AL2023_IMAGE_RESOLVED} \
            /bin/bash -lc "set -euo pipefail; uname -m | grep -qx aarch64; grep -q Amazon /etc/os-release; grep -q 2023 /etc/os-release; dnf -y install gcc gcc-c++ make openssl-devel pkgconf-pkg-config git curl-minimal tar gzip; if [ ! -x /workspace/.cache/cargo/bin/rustup ]; then curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain ${RUST_TOOLCHAIN}; else /workspace/.cache/cargo/bin/rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal; /workspace/.cache/cargo/bin/rustup default ${RUST_TOOLCHAIN}; fi; export PATH=/workspace/.cache/cargo/bin:\$PATH; rustc -V; cargo -V; cd debot && cargo build --release --locked --bin xvenue_hedge_holder; chown -R \${HOST_UID}:\${HOST_GID} /workspace/debot/target /workspace/.cache/cargo /workspace/.cache/rustup"

      - name: Fix cargo cache permissions
        if: steps.build_hedge.outcome == 'success'
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            sudo chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          else
            chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          fi

      - name: Save cargo cache (native arm64, xvenue hedge)
        if: steps.build_hedge.outcome == 'success' && steps.cache_cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-xvenue-hedge-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-${{ hashFiles('debot/Cargo.lock') }}

      - name: Verify dynamic links in AL2023
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}/debot/target/release/xvenue_hedge_holder:/artifacts/xvenue_hedge_holder:ro" -v "${{ github.workspace }}/lighter-go/build/libsigner.so:/artifacts/libsigner.so:ro" -e LD_LIBRARY_PATH=/artifacts ${AL2023_IMAGE_RESOLVED} /bin/bash -lc "set -euo pipefail; if ldd /artifacts/xvenue_hedge_holder | grep -q 'not found'; then exit 1; fi; ldd /artifacts/xvenue_hedge_holder"

      - name: Package artifact
        run: |
          mkdir -p dist/bin dist/lib
          file debot/target/release/xvenue_hedge_holder | grep -q aarch64
          install -m 0755 debot/target/release/xvenue_hedge_holder dist/bin/xvenue_hedge_holder
          install -m 0644 lighter-go/build/libsigner.so dist/lib/libsigner.so

      # No AWS/SSM upload step on purpose (see header comment). Grab the
      # artifact from this run and push it to the Tokyo host by hand, the
      # same way freq/b were originally deployed (see bot-strategy#798).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xvenue-hedge-holder-arm64-${{ github.sha }}
          path: dist/
          retention-days: 14
