name: Deploy Hyperliquid Observer

# bot-strategy#724: builds the dedicated hyperliquid-sdk observer binary
# (mutually exclusive with the default lighter-sdk feature, so it cannot
# reuse /opt/debot/bin/debot) and ships it to /opt/debot-hl/ on Frankfurt.
# workflow_dispatch only — the observer is not part of the ci.yml pipeline
# and is never auto-(re)started: the operator starts/restarts the unit
# manually, consistent with bot-strategy#269.

on:
  workflow_dispatch:
    inputs:
      dex_connector_ref:
        description: "Dex-connector ref/tag (default: the pinned env ref)"
        required: false
        type: string

concurrency:
  group: debot-hl-observer
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  INSTALL_DIR: /opt/debot-hl
  # Keep in sync with ci.yml's pin; hyperliquid-sdk landed in v4.7.5.
  DEX_CONNECTOR_REF: v4.7.6
  AL2023_IMAGE: public.ecr.aws/amazonlinux/amazonlinux:2023

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Protected-ref guard (same as ci.yml's deploy job): this ships a binary
    # to the production host, so a workflow_dispatch against a feature branch
    # or tag must not deploy.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    # QEMU-emulated arm64 like ci.yml's deploy job, but the first hl-feature
    # build has no cache to warm-start from and was observed to exceed 180
    # minutes (run 29632538074 hit the timeout with the build still going,
    # which also skipped the cache save). 300 covers a cold build; warm
    # builds stay well under it.
    timeout-minutes: 300
    environment: debot
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ github.event.inputs.dex_connector_ref || env.DEX_CONNECTOR_REF }}
          path: dex-connector
          token: ${{ secrets.DEX_CONNECTOR_PAT || github.token }}

      # No lighter-go / libsigner checkout or build: the hyperliquid-sdk
      # feature has no Go signer dependency.

      - name: Cache cargo (linux/arm64, hyperliquid feature set)
        id: cache_cargo
        uses: actions/cache@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          # Distinct from ci.yml's cargo-arm64-* keys: the feature set
          # changes what target/ contains.
          key: ${{ runner.os }}-cargo-arm64-hl-${{ hashFiles('debot/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arm64-hl-
            ${{ runner.os }}-cargo-arm64-

      - name: Build debot (linux/arm64, --features hyperliquid-sdk)
        id: build_debot
        run: |
          mkdir -p .cache/cargo/registry .cache/cargo/git .cache/cargo/bin .cache/rustup debot/target
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_HOME=/workspace/.cache/cargo \
            -e RUSTUP_HOME=/workspace/.cache/rustup \
            -e CARGO_INCREMENTAL=0 \
            ${AL2023_IMAGE} \
            /bin/bash -lc "set -euo pipefail; dnf -y install gcc gcc-c++ make openssl-devel pkgconf-pkg-config git curl-minimal tar gzip; if [ ! -x /workspace/.cache/cargo/bin/rustup ]; then curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable; fi; export PATH=/workspace/.cache/cargo/bin:\$PATH; rustc -V; cargo -V; cd debot && cargo build --release --locked --no-default-features --features hyperliquid-sdk; chown -R ${HOST_UID}:${HOST_GID} /workspace/debot/target /workspace/.cache/cargo /workspace/.cache/rustup"

      - name: Record binary SHA
        run: |
          sha256sum debot/target/release/debot
          echo "pairtrade SHA: ${{ github.sha }}"
          git -C dex-connector rev-parse HEAD | sed 's/^/dex-connector SHA: /'

      - name: Fix cargo cache permissions
        if: steps.build_debot.outcome == 'success'
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            sudo chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          else
            chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          fi

      - name: Save cargo cache (linux/arm64, hyperliquid feature set)
        if: steps.build_debot.outcome == 'success' && steps.cache_cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          key: ${{ runner.os }}-cargo-arm64-hl-${{ hashFiles('debot/Cargo.lock') }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifacts to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          aws s3 cp debot/target/release/debot "s3://${S3_BUCKET}/debot-hl/debot"
          # Self-contained deploy: ship the wrapper + unit too so a dispatch
          # run does not depend on a prior ci.yml scripts sync.
          aws s3 cp debot/scripts/debot-pair-hyperliquid-observe.sh "s3://${S3_BUCKET}/debot/scripts/debot-pair-hyperliquid-observe.sh"
          aws s3 cp debot/scripts/archive_observer_journal.sh "s3://${S3_BUCKET}/debot/scripts/archive_observer_journal.sh"
          aws s3 cp debot/deploy/debot-pair-hyperliquid-observe.service "s3://${S3_BUCKET}/deploy/debot-pair-hyperliquid-observe.service"
          aws s3 cp debot/deploy/archive-hyperliquid-observer-journal.service "s3://${S3_BUCKET}/deploy/archive-hyperliquid-observer-journal.service"
          aws s3 cp debot/deploy/archive-hyperliquid-observer-journal.timer "s3://${S3_BUCKET}/deploy/archive-hyperliquid-observer-journal.timer"

      - name: Deploy via SSM (no observer start)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
          INSTANCE_ID: ${{ secrets.INSTANCE_ID || vars.INSTANCE_ID }}
        run: |
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "sudo mkdir -p __INSTALL_DIR__/bin __INSTALL_DIR__/history_archive",
              "aws s3 cp s3://__S3_BUCKET__/debot-hl/debot __INSTALL_DIR__/bin/debot",
              "sudo chmod 755 __INSTALL_DIR__/bin/debot",
              "aws s3 cp s3://__S3_BUCKET__/debot/scripts/debot-pair-hyperliquid-observe.sh /opt/debot/scripts/debot-pair-hyperliquid-observe.sh",
              "sudo chmod 755 /opt/debot/scripts/debot-pair-hyperliquid-observe.sh",
              "aws s3 cp s3://__S3_BUCKET__/debot/scripts/archive_observer_journal.sh /opt/debot/scripts/archive_observer_journal.sh",
              "sudo chmod 755 /opt/debot/scripts/archive_observer_journal.sh",
              "/bin/bash -lc 'set -e; svc=debot-pair-hyperliquid-observe; aws s3 cp s3://__S3_BUCKET__/deploy/$svc.service /tmp/$svc.service; if [ ! -f /etc/systemd/system/$svc.service ] || ! cmp -s /etc/systemd/system/$svc.service /tmp/$svc.service; then sudo mv /tmp/$svc.service /etc/systemd/system/$svc.service; sudo systemctl daemon-reload; else rm /tmp/$svc.service; fi'",
              "/bin/bash -lc 'set -e; base=archive-hyperliquid-observer-journal; aws s3 cp s3://__S3_BUCKET__/deploy/$base.service /tmp/$base.service; aws s3 cp s3://__S3_BUCKET__/deploy/$base.timer /tmp/$base.timer; sudo mv /tmp/$base.service /tmp/$base.timer /etc/systemd/system/; sudo systemctl daemon-reload; sudo systemctl enable --now $base.timer'"
            ]
          }
          JSON
          sed -i "s|__INSTALL_DIR__|${INSTALL_DIR}|g; s|__S3_BUCKET__|${S3_BUCKET}|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy debot hyperliquid observer" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          # No service start/restart above, so the command finishes as soon
          # as the S3 pulls + daemon-reload complete.
          SSM_DEPLOY_TIMEOUT_SECS=${SSM_DEPLOY_TIMEOUT_SECS:-1800}
          POLL_INTERVAL_SECS=30
          deadline=$(( $(date +%s) + SSM_DEPLOY_TIMEOUT_SECS ))
          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
                exit 0 ;;
              Cancelled|TimedOut|Failed)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
                echo "##[error]SSM command finished with status ${STATUS}"
                exit 1 ;;
              Pending|InProgress|Delayed)
                : ;;
              *)
                echo "Unexpected SSM status: ${STATUS}" ;;
            esac
            if [ $(date +%s) -ge ${deadline} ]; then
              aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text || true
              echo "##[error]Deploy polling timed out after ${SSM_DEPLOY_TIMEOUT_SECS}s (last status: ${STATUS})"
              exit 1
            fi
            echo "deploy in progress (status=${STATUS}), sleeping ${POLL_INTERVAL_SECS}s..."
            sleep ${POLL_INTERVAL_SECS}
          done
