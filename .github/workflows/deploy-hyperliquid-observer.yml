name: Deploy Hyperliquid Observer

# bot-strategy#724: builds the dedicated hyperliquid-sdk observer binary
# (mutually exclusive with the default lighter-sdk feature, so it cannot
# reuse /opt/debot/bin/debot) and ships it to /opt/debot-hl/ on Frankfurt.
# workflow_dispatch only — the observer is not part of the ci.yml pipeline
# and is never auto-(re)started: the operator starts/restarts the unit
# manually, consistent with bot-strategy#269.

on:
  workflow_dispatch:
    inputs:
      dex_connector_ref:
        description: "Dex-connector ref/tag (default: the pinned env ref)"
        required: false
        type: string
      target:
        description: "build only or deploy the verified artifact"
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - deploy

concurrency:
  group: debot-hl-observer
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  INSTALL_DIR: /opt/debot-hl
  # Keep in sync with ci.yml's pin; hyperliquid-sdk landed in v4.7.5.
  DEX_CONNECTOR_REF: v4.7.15
  AL2023_IMAGE: public.ecr.aws/amazonlinux/amazonlinux:2023
  RUST_TOOLCHAIN: 1.94.1

jobs:
  test:
    name: Test Hyperliquid observer (x86_64)
    runs-on: ubuntu-latest
    outputs:
      dex_connector_sha: ${{ steps.dex_source.outputs.dex_connector_sha }}
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ github.event.inputs.dex_connector_ref || env.DEX_CONNECTOR_REF }}
          path: dex-connector
          token: ${{ github.token }}

      - name: Resolve tested dex-connector source
        id: dex_source
        run: |
          DEX_CONNECTOR_SHA=$(git -C "${GITHUB_WORKSPACE}/dex-connector" rev-parse HEAD)
          echo "dex_connector_sha=${DEX_CONNECTOR_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo tests
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            debot/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-test-hl-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('debot/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-test-hl-${{ env.RUST_TOOLCHAIN }}-

      - name: Run Hyperliquid observer tests
        run: |
          cargo test --manifest-path debot/Cargo.toml --locked --no-default-features --features hyperliquid-sdk --lib
          cargo test --manifest-path debot/Cargo.toml --locked --no-default-features --features hyperliquid-sdk --bin debot

  build:
    name: Build Hyperliquid observer (native arm64)
    needs: test
    runs-on: ubuntu-24.04-arm
    # A feature branch may benchmark build-only, but only a protected branch
    # may publish or deploy.
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'build-only' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    timeout-minutes: 60
    outputs:
      binary_sha256: ${{ steps.package.outputs.binary_sha256 }}
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ needs.test.outputs.dex_connector_sha }}
          path: dex-connector
          token: ${{ github.token }}

      # No lighter-go / libsigner checkout or build: the hyperliquid-sdk
      # feature has no Go signer dependency.

      - name: Resolve build image
        id: build_image
        run: |
          docker pull --platform linux/arm64 "${AL2023_IMAGE}"
          AL2023_IMAGE_RESOLVED=$(docker image inspect --format="{{index .RepoDigests 0}}" "${AL2023_IMAGE}")
          echo "AL2023_IMAGE_RESOLVED=${AL2023_IMAGE_RESOLVED}" >> "${GITHUB_ENV}"
          BUILD_IMAGE_CACHE_KEY=$(printf "%s" "${AL2023_IMAGE_RESOLVED}" | sha256sum)
          echo "cache_key=${BUILD_IMAGE_CACHE_KEY%% *}" >> "${GITHUB_OUTPUT}"

      - name: Cache cargo (native arm64, hyperliquid feature set)
        uses: actions/cache@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          # Distinct from ci.yml's cargo-arm64-* keys: the feature set
          # changes what target/ contains.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-hl-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-${{ hashFiles('debot/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-hl-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-

      - name: Build debot in AL2023 (native arm64, hyperliquid-sdk)
        id: build_debot
        run: |
          mkdir -p .cache/cargo/registry .cache/cargo/git .cache/cargo/bin .cache/rustup debot/target
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_HOME=/workspace/.cache/cargo \
            -e RUSTUP_HOME=/workspace/.cache/rustup \
            -e CARGO_INCREMENTAL=0 \
            ${AL2023_IMAGE_RESOLVED} \
            /bin/bash -lc "set -euo pipefail; uname -m | grep -qx aarch64; grep -q Amazon /etc/os-release; grep -q 2023 /etc/os-release; dnf -y install gcc gcc-c++ make openssl-devel pkgconf-pkg-config git curl-minimal tar gzip; if [ ! -x /workspace/.cache/cargo/bin/rustup ]; then curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain ${RUST_TOOLCHAIN}; else /workspace/.cache/cargo/bin/rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal; /workspace/.cache/cargo/bin/rustup default ${RUST_TOOLCHAIN}; fi; export PATH=/workspace/.cache/cargo/bin:\$PATH; rustc -V; cargo -V; cd debot && cargo build --release --locked --no-default-features --features hyperliquid-sdk; chown -R ${HOST_UID}:${HOST_GID} /workspace/debot/target /workspace/.cache/cargo /workspace/.cache/rustup"

      - name: Verify and package artifact
        id: package
        run: |
          set -euo pipefail
          BINARY=debot/target/release/debot
          file "${BINARY}"
          file "${BINARY}" | grep -q aarch64
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}/${BINARY}:/artifacts/debot:ro" \
            ${AL2023_IMAGE_RESOLVED} \
            /bin/bash -lc "set -euo pipefail; if ldd /artifacts/debot | grep -q not.found; then exit 1; fi; ldd /artifacts/debot"

          mkdir -p dist
          install -m 0755 "${BINARY}" dist/debot
          test "$(stat -c %a dist/debot)" = 755
          BINARY_SHA256=$(sha256sum dist/debot | cut -d " " -f1)
          CARGO_LOCK_SHA256=$(sha256sum debot/Cargo.lock | cut -d " " -f1)
          DEX_CONNECTOR_SHA=$(git -C dex-connector rev-parse HEAD)
          (cd dist && sha256sum debot > debot.sha256)
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg dex_connector_sha "${DEX_CONNECTOR_SHA}" \
            --arg binary_sha256 "${BINARY_SHA256}" \
            --arg cargo_lock_sha256 "${CARGO_LOCK_SHA256}" \
            --arg rust_toolchain "${RUST_TOOLCHAIN}" \
            --arg build_image "${AL2023_IMAGE_RESOLVED}" \
            --arg github_run_id "${GITHUB_RUN_ID}" \
            --arg github_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{schema_version: 1, artifact: "debot-hyperliquid-observer", architecture: "aarch64", feature_set: "hyperliquid-sdk", source_sha: $source_sha, dex_connector_sha: $dex_connector_sha, cargo_lock_sha256: $cargo_lock_sha256, binary_sha256: $binary_sha256, mode: "0755", rust_toolchain: $rust_toolchain, build_image: $build_image, github_run_id: $github_run_id, github_run_attempt: $github_run_attempt}' > dist/manifest.json
          echo "binary_sha256=${BINARY_SHA256}" >> "${GITHUB_OUTPUT}"
          (cd dist && sha256sum -c debot.sha256)
          jq . dist/manifest.json

      - name: Fix cargo cache permissions
        if: steps.build_debot.outcome == 'success'
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            sudo chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          else
            chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          fi

      - name: Upload verified deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-observer-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            dist/debot
            dist/debot.sha256
            dist/manifest.json
            debot/scripts/debot-pair-hyperliquid-observe.sh
            debot/scripts/archive_observer_journal.sh
            debot/deploy/debot-pair-hyperliquid-observe.service
            debot/deploy/archive-hyperliquid-observer-journal.service
            debot/deploy/archive-hyperliquid-observer-journal.timer

  deploy:
    name: Deploy verified Hyperliquid observer
    needs: build
    if: inputs.target == 'deploy' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: debot
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: hyperliquid-observer-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifacts to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          aws s3 cp dist/debot "s3://${S3_BUCKET}/debot-hl/debot"
          aws s3 cp dist/debot.sha256 "s3://${S3_BUCKET}/debot-hl/debot.sha256"
          aws s3 cp dist/manifest.json "s3://${S3_BUCKET}/debot-hl/manifest.json"
          # Self-contained deploy: ship the wrapper + unit too so a dispatch
          # run does not depend on a prior ci.yml scripts sync.
          aws s3 cp debot/scripts/debot-pair-hyperliquid-observe.sh "s3://${S3_BUCKET}/debot/scripts/debot-pair-hyperliquid-observe.sh"
          aws s3 cp debot/scripts/archive_observer_journal.sh "s3://${S3_BUCKET}/debot/scripts/archive_observer_journal.sh"
          aws s3 cp debot/deploy/debot-pair-hyperliquid-observe.service "s3://${S3_BUCKET}/deploy/debot-pair-hyperliquid-observe.service"
          aws s3 cp debot/deploy/archive-hyperliquid-observer-journal.service "s3://${S3_BUCKET}/deploy/archive-hyperliquid-observer-journal.service"
          aws s3 cp debot/deploy/archive-hyperliquid-observer-journal.timer "s3://${S3_BUCKET}/deploy/archive-hyperliquid-observer-journal.timer"

      - name: Deploy via SSM (no observer start)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
          INSTANCE_ID: ${{ secrets.INSTANCE_ID || vars.INSTANCE_ID }}
          BINARY_SHA256: ${{ needs.build.outputs.binary_sha256 }}
        run: |
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "set -e",
              "sudo mkdir -p __INSTALL_DIR__/bin __INSTALL_DIR__/history_archive",
              "aws s3 cp s3://__S3_BUCKET__/debot-hl/debot /tmp/debot-hl",
              "aws s3 cp s3://__S3_BUCKET__/debot-hl/debot.sha256 /tmp/debot-hl.sha256",
              "aws s3 cp s3://__S3_BUCKET__/debot-hl/manifest.json /tmp/debot-hl-manifest.json",
              "echo __BINARY_SHA256__ /tmp/debot-hl | sha256sum -c - || exit 1",
              "sed 's|  debot$|  debot-hl|' /tmp/debot-hl.sha256 | (cd /tmp && sha256sum -c -) || exit 1",
              "sudo install -o root -g root -m 0755 /tmp/debot-hl __INSTALL_DIR__/bin/debot",
              "sudo install -o root -g root -m 0644 /tmp/debot-hl-manifest.json __INSTALL_DIR__/manifest.json",
              "sudo test $(stat -c %U:%G:%a __INSTALL_DIR__/bin/debot) = root:root:755 || exit 1",
              "echo __BINARY_SHA256__ __INSTALL_DIR__/bin/debot | sudo sha256sum -c - || exit 1",
              "aws s3 cp s3://__S3_BUCKET__/debot/scripts/debot-pair-hyperliquid-observe.sh /opt/debot/scripts/debot-pair-hyperliquid-observe.sh",
              "sudo chmod 755 /opt/debot/scripts/debot-pair-hyperliquid-observe.sh",
              "aws s3 cp s3://__S3_BUCKET__/debot/scripts/archive_observer_journal.sh /opt/debot/scripts/archive_observer_journal.sh",
              "sudo chmod 755 /opt/debot/scripts/archive_observer_journal.sh",
              "/bin/bash -lc 'set -e; svc=debot-pair-hyperliquid-observe; aws s3 cp s3://__S3_BUCKET__/deploy/$svc.service /tmp/$svc.service; if [ ! -f /etc/systemd/system/$svc.service ] || ! cmp -s /etc/systemd/system/$svc.service /tmp/$svc.service; then sudo mv /tmp/$svc.service /etc/systemd/system/$svc.service; sudo systemctl daemon-reload; else rm /tmp/$svc.service; fi'",
              "/bin/bash -lc 'set -e; base=archive-hyperliquid-observer-journal; aws s3 cp s3://__S3_BUCKET__/deploy/$base.service /tmp/$base.service; aws s3 cp s3://__S3_BUCKET__/deploy/$base.timer /tmp/$base.timer; sudo mv /tmp/$base.service /tmp/$base.timer /etc/systemd/system/; sudo systemctl daemon-reload; sudo systemctl enable --now $base.timer'"
            ]
          }
          JSON
          sed -i "s|__INSTALL_DIR__|${INSTALL_DIR}|g; s|__S3_BUCKET__|${S3_BUCKET}|g; s|__BINARY_SHA256__|${BINARY_SHA256}|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy debot hyperliquid observer" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          # No service start/restart above, so the command finishes as soon
          # as the S3 pulls + daemon-reload complete.
          SSM_DEPLOY_TIMEOUT_SECS=${SSM_DEPLOY_TIMEOUT_SECS:-1800}
          POLL_INTERVAL_SECS=30
          deadline=$(( $(date +%s) + SSM_DEPLOY_TIMEOUT_SECS ))
          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
                exit 0 ;;
              Cancelled|TimedOut|Failed)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
                echo "##[error]SSM command finished with status ${STATUS}"
                exit 1 ;;
              Pending|InProgress|Delayed)
                : ;;
              *)
                echo "Unexpected SSM status: ${STATUS}" ;;
            esac
            if [ $(date +%s) -ge ${deadline} ]; then
              aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text || true
              echo "##[error]Deploy polling timed out after ${SSM_DEPLOY_TIMEOUT_SECS}s (last status: ${STATUS})"
              exit 1
            fi
            echo "deploy in progress (status=${STATUS}), sleeping ${POLL_INTERVAL_SECS}s..."
            sleep ${POLL_INTERVAL_SECS}
          done
