name: Robinhood dip-grid build (bot-strategy#816)

# Build-only CI for src/bin/robinhood_dipgrid.rs — the prototype bot from
# pairtrade#217. Deliberately does NOT deploy anywhere: the strategy is
# still pre-DRY_RUN-soak (see the module doc comment in the binary itself
# for known gaps), so no AWS credentials/SSM access are granted here.
# Robinhood Chain Lighter (Tokyo) deploys have always been manual SSM
# pushes (see #798) — this workflow only produces a downloadable ARM64
# artifact for that same manual path, it does not automate it.
#
# The main ci.yml's build-test job already runs `cargo check/test
# --all-targets` on every src/** push (native x86_64), which covers this
# binary too. What's unique here is the ARM64 cross-compile (Tokyo's
# actual host architecture) and a ready-to-copy artifact.

on:
  push:
    paths:
      - "src/bin/robinhood_dipgrid.rs"
      - "src/trade/**"
      - "src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-robinhood-dipgrid.yml"
  workflow_dispatch:
    inputs:
      dex_connector_ref:
        description: "Dex-connector ref/tag override (optional)"
        required: false
        type: string

concurrency:
  group: robinhood-dipgrid-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEX_CONNECTOR_REF: v4.7.2
  LIGHTER_GO_REF: v1.0.2
  AL2023_IMAGE: public.ecr.aws/amazonlinux/amazonlinux:2023
  RUST_TOOLCHAIN: 1.94.1

jobs:
  # Mirrors ci.yml's own resolve-ref job: default to the latest dex-connector
  # tag unless a workflow_dispatch input overrides it. Keeps this workflow
  # tracking the same target as the main CI instead of drifting on its own
  # separate hardcoded pin.
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      dex_connector_ref: ${{ steps.resolve.outputs.dex_connector_ref }}
    steps:
      - name: Resolve dex-connector ref
        id: resolve
        env:
          DEFAULT_REF: ${{ env.DEX_CONNECTOR_REF }}
          INPUT_REF: ${{ github.event.inputs.dex_connector_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          default_ref = os.environ.get("DEFAULT_REF", "").strip()
          input_ref = (os.environ.get("INPUT_REF") or "").strip()
          token = os.environ.get("GH_TOKEN", "")

          ref = input_ref or default_ref
          if not input_ref:
              try:
                  req = urllib.request.Request(
                      "https://api.github.com/repos/shigeo-nakamura/dex-connector/tags?per_page=1",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.load(resp)
                  if data and "name" in data[0]:
                      ref = data[0]["name"]
              except Exception:
                  pass

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"dex_connector_ref={ref}\n")
          PY

  check-native:
    needs: resolve-ref
    runs-on: ubuntu-latest
    env:
      DEX_CONNECTOR_REF: ${{ needs.resolve-ref.outputs.dex_connector_ref }}
      LIGHTER_GO_PATH: ${{ github.workspace }}/lighter-go
      LD_LIBRARY_PATH: ${{ github.workspace }}/lighter-go
    defaults:
      run:
        working-directory: debot
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ env.DEX_CONNECTOR_REF }}
          path: dex-connector
          token: ${{ secrets.DEX_CONNECTOR_PAT || github.token }}

      - name: Checkout lighter-go
        uses: actions/checkout@v5
        with:
          repository: elliottech/lighter-go
          ref: ${{ env.LIGHTER_GO_REF }}
          path: lighter-go

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: lighter-go/go.sum

      - name: Build libsigner
        run: go build -buildmode=c-shared -trimpath -o libsigner.so ./sharedlib
        working-directory: ${{ github.workspace }}/lighter-go

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            debot -> target

      - name: Cargo check (robinhood_dipgrid only)
        run: cargo check --bin robinhood_dipgrid --locked

      - name: Cargo test (robinhood_dipgrid only)
        run: cargo test --bin robinhood_dipgrid --locked

  # Native ARM64 runner, matching ci.yml's current deploy job (bot-strategy#805
  # migrated it off QEMU). An earlier version of this workflow copied the
  # since-superseded QEMU+ubuntu-latest pattern and genuinely timed out at
  # both 60min and 180min on a cold cache -- ci.yml's own comment now bounds
  # its equivalent native-arm64 release build at ~30min, which is what
  # motivated re-deriving this job from the current ci.yml instead.
  build-arm64:
    needs: [resolve-ref, check-native]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      DEX_CONNECTOR_REF: ${{ needs.resolve-ref.outputs.dex_connector_ref }}
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ env.DEX_CONNECTOR_REF }}
          path: dex-connector
          token: ${{ secrets.DEX_CONNECTOR_PAT || github.token }}

      - name: Checkout lighter-go
        uses: actions/checkout@v5
        with:
          repository: elliottech/lighter-go
          ref: ${{ env.LIGHTER_GO_REF }}
          path: lighter-go

      - name: Resolve build image
        id: build_image
        run: |
          docker pull --platform linux/arm64 "${AL2023_IMAGE}"
          AL2023_IMAGE_RESOLVED=$(docker image inspect --format="{{index .RepoDigests 0}}" "${AL2023_IMAGE}")
          echo "AL2023_IMAGE_RESOLVED=${AL2023_IMAGE_RESOLVED}" >> "${GITHUB_ENV}"
          BUILD_IMAGE_CACHE_KEY=$(printf "%s" "${AL2023_IMAGE_RESOLVED}" | sha256sum)
          echo "cache_key=${BUILD_IMAGE_CACHE_KEY%% *}" >> "${GITHUB_OUTPUT}"

      - name: Cache libsigner (native arm64)
        id: cache_libsigner
        uses: actions/cache@v5
        with:
          path: lighter-go/build/libsigner.so
          key: ${{ runner.os }}-${{ runner.arch }}-libsigner-${{ env.LIGHTER_GO_REF }}-${{ steps.build_image.outputs.cache_key }}-${{ hashFiles('lighter-go/go.sum') }}

      - name: Build libsigner in AL2023 (native arm64)
        if: steps.cache_libsigner.outputs.cache-hit != 'true'
        run: |
          mkdir -p lighter-go/build
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}/lighter-go:/go/src/sdk" \
            -w /go/src/sdk \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            ${AL2023_IMAGE_RESOLVED} \
            /bin/bash -lc "set -euo pipefail; uname -m | grep -qx aarch64; grep -q Amazon /etc/os-release; grep -q 2023 /etc/os-release; dnf -y install golang gcc; CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -buildvcs=false -buildmode=c-shared -trimpath -o ./build/libsigner.so ./sharedlib; chown -R \${HOST_UID}:\${HOST_GID} /go/src/sdk/build"

      - name: Save libsigner cache (native arm64)
        if: steps.cache_libsigner.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: lighter-go/build/libsigner.so
          key: ${{ runner.os }}-${{ runner.arch }}-libsigner-${{ env.LIGHTER_GO_REF }}-${{ steps.build_image.outputs.cache_key }}-${{ hashFiles('lighter-go/go.sum') }}

      - name: Cache cargo (native arm64, dipgrid)
        id: cache_cargo
        uses: actions/cache@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          # Distinct suffix from ci.yml's cargo-lighter-* keys: this builds
          # only the robinhood_dipgrid bin target, not the full debot binary,
          # so target/ contents differ. restore-keys still falls back to
          # ci.yml's own warm cache for the shared dependency graph.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-dipgrid-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-${{ hashFiles('debot/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-dipgrid-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-lighter-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-

      - name: Build robinhood_dipgrid in AL2023 (native arm64)
        id: build_dipgrid
        run: |
          mkdir -p .cache/cargo/registry .cache/cargo/git .cache/cargo/bin .cache/rustup debot/target
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_HOME=/workspace/.cache/cargo \
            -e RUSTUP_HOME=/workspace/.cache/rustup \
            -e CARGO_INCREMENTAL=0 \
            -e LIGHTER_GO_PATH=/workspace/lighter-go/build \
            -e LD_LIBRARY_PATH=/workspace/lighter-go/build \
            ${AL2023_IMAGE_RESOLVED} \
            /bin/bash -lc "set -euo pipefail; uname -m | grep -qx aarch64; grep -q Amazon /etc/os-release; grep -q 2023 /etc/os-release; dnf -y install gcc gcc-c++ make openssl-devel pkgconf-pkg-config git curl-minimal tar gzip; if [ ! -x /workspace/.cache/cargo/bin/rustup ]; then curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain ${RUST_TOOLCHAIN}; else /workspace/.cache/cargo/bin/rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal; /workspace/.cache/cargo/bin/rustup default ${RUST_TOOLCHAIN}; fi; export PATH=/workspace/.cache/cargo/bin:\$PATH; rustc -V; cargo -V; cd debot && cargo build --release --locked --bin robinhood_dipgrid; chown -R \${HOST_UID}:\${HOST_GID} /workspace/debot/target /workspace/.cache/cargo /workspace/.cache/rustup"

      - name: Fix cargo cache permissions
        if: steps.build_dipgrid.outcome == 'success'
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            sudo chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          else
            chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          fi

      - name: Save cargo cache (native arm64, dipgrid)
        if: steps.build_dipgrid.outcome == 'success' && steps.cache_cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-dipgrid-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-${{ hashFiles('debot/Cargo.lock') }}

      - name: Verify dynamic links in AL2023
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}/debot/target/release/robinhood_dipgrid:/artifacts/robinhood_dipgrid:ro" -v "${{ github.workspace }}/lighter-go/build/libsigner.so:/artifacts/libsigner.so:ro" -e LD_LIBRARY_PATH=/artifacts ${AL2023_IMAGE_RESOLVED} /bin/bash -lc "set -euo pipefail; if ldd /artifacts/robinhood_dipgrid | grep -q 'not found'; then exit 1; fi; ldd /artifacts/robinhood_dipgrid"

      - name: Package artifact
        run: |
          mkdir -p dist/bin dist/lib
          file debot/target/release/robinhood_dipgrid | grep -q aarch64
          install -m 0755 debot/target/release/robinhood_dipgrid dist/bin/robinhood_dipgrid
          install -m 0644 lighter-go/build/libsigner.so dist/lib/libsigner.so

      # No AWS/SSM upload step on purpose (see header comment). Grab the
      # artifact from this run and push it to the Tokyo host by hand, the
      # same way freq/b were originally deployed (see bot-strategy#798).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: robinhood-dipgrid-arm64-${{ github.sha }}
          path: dist/
          retention-days: 14
