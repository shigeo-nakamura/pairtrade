name: Rust CI

on:
  push:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/**"
      # The one configs/ exception (bot-strategy#952): a book instance's
      # config and its calendar are validated by `Scheduler::build` in
      # `cargo test --lib book::schedule`, which lives here, and the pair
      # is only ever changed together. Without this a config-only push
      # (a wider signal_grace_secs, a regenerated calendar) would reach
      # the hosts having been checked for nothing but generator
      # agreement, and fail at the next install instead. These files
      # change roughly monthly, so paying for the build is the cheaper
      # side of the trade.
      - "configs/book/**"
      # The rest of configs/** lives in deploy-configs.yml's trigger list — that
      # workflow handles config-only pushes in 30 s. ci.yml's heavy
      # arm64 Rust build only fires when actual code or workflow
      # files change. A combined push that touches both src/ and
      # configs/ still fires ci.yml via src/**, and ci.yml's deploy
      # step uploads configs as part of its full pipeline.
      # scripts/** is deliberately NOT here (bot-strategy#765 round4):
      # the resolve-ref job's should_deploy is unconditional, so any
      # path that fires this workflow on master also runs the arm64
      # build and deploy. deploy-configs.yml already syncs scripts/**
      # to the hosts with no restart in ~30s, so a scripts-only push
      # has no business reaching that pipeline. Script unit tests run
      # in test-scripts.yml instead, gated on scripts/** only.
  workflow_dispatch:
    inputs:
      dex_connector_ref:
        description: "Dex-connector ref/tag (optional)"
        required: false
        type: string
      target:
        description: "build or deployment target"
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - deploy

concurrency:
  group: debot-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  INSTALL_DIR: /opt/debot
  LIGHTER_GO_REF: v1.0.2
  AL2023_IMAGE: public.ecr.aws/amazonlinux/amazonlinux:2023
  RUST_TOOLCHAIN: 1.94.1

jobs:
  # bot-strategy#269: the trading bot must be restarted manually only.
  # Auto-restart from CI force-closes open positions inside systemd's 90s
  # TimeoutStopSec window. Lint every workflow file on every push so a
  # regression here fails the build before deploy can run. The sidecar
  # `lighter-ratelimit` (no exchange position) is exempt and intentionally
  # not matched by this pattern.
  lint-no-bot-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Forbid bot auto-restart in CI workflows
        # bot-strategy#269: trading services are restarted manually only.
        # An auto-restart from CI can force-close an open position inside
        # systemd's TimeoutStopSec window. The BTC/ETH pairtrade units this
        # guard was written for were sunset on 2026-09-06 (bot-strategy#937);
        # the guard now covers every trading unit this repo still deploys.
        run: |
          if grep -nE 'systemctl[[:space:]]+(restart|start)[[:space:]]+(debot-pair-[a-z-]+|engine-b-live|debot-bull-holder|book-runtime-[a-z0-9-]+)([[:space:]]|$)' .github/workflows/*.yml; then
            echo "::error::CI workflow contains a forbidden 'systemctl restart/start <trading unit>' — trading services must be restarted manually only (bot-strategy#269)."
            exit 1
          fi

      # bot-strategy#899: every workflow that checks out dex-connector must
      # take its ref from _resolve-dex-connector-ref.yml, which reads
      # Cargo.lock. A hand-maintained `DEX_CONNECTOR_REF: vX.Y.Z` is the
      # "bump three files by hand" trap documented in CLAUDE.md: ci.yml
      # follows Cargo.lock and stays green while a deploy workflow's static
      # pin silently ships a binary built against an older dex-connector
      # (bot-strategy#865 hit exactly this). bot-strategy#973 added a second
      # shape: a reusable workflow does the checkout for its caller and takes
      # the ref as an input, so `dex-connector-ref: v4.7.20` in a `with:`
      # block is the same pin wearing a different hat.
      #
      # The check lives in a script rather than a grep pipeline here because
      # a file-wide text search cannot tell which block a match came from --
      # Codex found two ways past the grep version (pairtrade#314): the
      # resolver filename matched the explanatory comment every caller
      # carries, and `.outputs.ref` matched any job's output. The script
      # walks the parsed workflows and resolves each ref expression back to
      # the job that produced it. Its own regression tests run in
      # test-scripts.yml, which is also what re-checks the committed
      # workflows when the script changes: scripts/** is deliberately not in
      # this workflow's path filter (see the comment on `on:` above).
      - name: Install the workflow lint's YAML parser
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml
      - name: Forbid per-workflow dex-connector ref pins
        run: python3 scripts/lint_workflow_dex_connector_refs.py

  resolve-ref:
    # bot-strategy#899: the resolution logic lives in one place now
    # (_resolve-dex-connector-ref.yml), because bot-strategy#892's fix had to
    # be hand-copied into every deploy workflow written after it.
    uses: ./.github/workflows/_resolve-dex-connector-ref.yml
    with:
      input-ref: ${{ inputs.dex_connector_ref || '' }}

  build-test:
    needs: resolve-ref
    runs-on: ubuntu-latest
    env:
      DEX_CONNECTOR_REF: ${{ needs.resolve-ref.outputs.ref }}
      LIGHTER_GO_PATH: ${{ github.workspace }}/lighter-go
      LD_LIBRARY_PATH: ${{ github.workspace }}/lighter-go
    defaults:
      run:
        working-directory: debot
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ env.DEX_CONNECTOR_REF }}
          path: dex-connector
          token: ${{ secrets.DEX_CONNECTOR_PAT || github.token }}

      - name: Checkout lighter-go
        uses: actions/checkout@v5
        with:
          repository: elliottech/lighter-go
          ref: ${{ env.LIGHTER_GO_REF }}
          path: lighter-go

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: lighter-go/go.sum

      - name: Build libsigner
        run: go build -buildmode=c-shared -trimpath -o libsigner.so ./sharedlib
        working-directory: ${{ github.workspace }}/lighter-go

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            debot -> target

      - name: Cargo check
        run: cargo check --all-targets --locked

      - name: Cargo test
        run: cargo test --all-targets --locked

      - name: Arcus Spot feature check
        run: cargo check --all-targets --no-default-features --features arcus-spot-sdk --locked

      - name: Arcus Spot runtime tests
        run: cargo test --lib --no-default-features --features arcus-spot-sdk arcus_spot --locked

      # `--lib` above only tests the library target; the arcus-spot-runtime
      # binary (required-features = ["arcus-spot-sdk"]) is excluded from it
      # and from the default-feature `cargo test --all-targets` above, so
      # its own tests -- including the same_file alias-detection guards
      # against silently truncating the recorder archive or config -- never
      # actually ran in CI (Codex P2 follow-up, pairtrade#177).
      - name: Arcus Spot runtime binary tests
        run: cargo test --bin arcus-spot-runtime --no-default-features --features arcus-spot-sdk --locked

  # bot-strategy#973: none of the passes in build-test above ever compiles
  # the `arcus-spot-live` feature -- the live executor that signs with KMS
  # and moves real inventory. Its two binaries carry
  # `required-features = ["arcus-spot-live"]`, which excludes them from
  # `--all-targets`, and the `arcus-spot-sdk` passes stop short of the
  # feature that pulls in dex-connector/arcus-spot-execution, ethers and
  # rusoto (379 lib tests with it against 109 without). Before this job the
  # only run of these tests was deploy-arcus-spot-executor.yml, on master
  # push -- verification strictly after merge, where a break also blocks the
  # executor deploy (pairtrade#309 shipped six failing tests past a fully
  # green ci.yml). It is a separate job, not a step in build-test, so the
  # extra compile runs in parallel and does not extend the pipeline's
  # wall-clock.
  #
  # Deliberately NOT in `deploy`'s needs: this repo's deploy job builds
  # engine_b_live and book-runtime, which share no code with the Arcus
  # executor, and the Arcus binary has its own deploy workflow that gates on
  # the same tests in release profile.
  test-arcus-spot-live:
    needs: resolve-ref
    uses: ./.github/workflows/_test-arcus-spot-live.yml
    with:
      dex-connector-ref: ${{ needs.resolve-ref.outputs.ref }}
      cargo-profile: debug
    secrets:
      DEX_CONNECTOR_PAT: ${{ secrets.DEX_CONNECTOR_PAT }}

  deploy:
    runs-on: ubuntu-24.04-arm
    # Builds the Lighter-linked binaries this repo still ships from master
    # (engine_b_live for the Robinhood Lighter host) and uploads them to S3.
    # CI never restarts a service (pairtrade#9 / bot-strategy#269): the
    # operator restarts manually after verifying the deployed sha.
    #
    # The BTC/ETH pairtrade `debot` binary and its Frankfurt deploy were
    # removed with the pairtrade sunset (bot-strategy#937). Frankfurt now
    # only hosts bull-holder (deploy-bull-holder.yml) and the dashboard.
    #
    # Native ARM64 keeps the AL2023 artifact contract without full-system
    # QEMU. The 60-minute cap includes packaging and optional deployment,
    # while the release build itself is measured against the 30-minute bound.
    timeout-minutes: 60
    needs: [resolve-ref, build-test, lint-no-bot-restart]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: debot
    env:
      DEX_CONNECTOR_REF: ${{ needs.resolve-ref.outputs.ref }}
    outputs:
      libsigner_sha256: ${{ steps.package.outputs.libsigner_sha256 }}
      engine_b_live_sha256: ${{ steps.package.outputs.engine_b_live_sha256 }}
      book_runtime_sha256: ${{ steps.package.outputs.book_runtime_sha256 }}
      book_prefix: ${{ steps.upload.outputs.book_prefix }}
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ env.DEX_CONNECTOR_REF }}
          path: dex-connector
          token: ${{ secrets.DEX_CONNECTOR_PAT || github.token }}

      - name: Checkout lighter-go
        uses: actions/checkout@v5
        with:
          repository: elliottech/lighter-go
          ref: ${{ env.LIGHTER_GO_REF }}
          path: lighter-go

      - name: Resolve build image
        id: build_image
        uses: ./debot/.github/actions/al2023-build-image
        with:
          image: ${{ env.AL2023_IMAGE }}

      - name: Build libsigner in AL2023 (native arm64)
        uses: ./debot/.github/actions/build-libsigner-al2023
        with:
          image-ref: ${{ steps.build_image.outputs.image_ref }}
          image-cache-key: ${{ steps.build_image.outputs.cache_key }}
          lighter-go-ref: ${{ env.LIGHTER_GO_REF }}

      - name: Cache cargo (native arm64)
        id: cache_cargo
        uses: actions/cache@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lighter-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-${{ hashFiles('debot/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-lighter-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-

      - name: Build debot in AL2023 (native arm64)
        id: build_debot
        run: |
          mkdir -p .cache/cargo/registry .cache/cargo/git .cache/cargo/bin .cache/rustup debot/target
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_HOME=/workspace/.cache/cargo \
            -e RUSTUP_HOME=/workspace/.cache/rustup \
            -e CARGO_INCREMENTAL=0 \
            -e LIGHTER_GO_PATH=/workspace/lighter-go/build \
            -e LD_LIBRARY_PATH=/workspace/lighter-go/build \
            ${AL2023_IMAGE_RESOLVED} \
            /bin/bash -lc "set -euo pipefail; uname -m | grep -qx aarch64; grep -q Amazon /etc/os-release; grep -q 2023 /etc/os-release; grep VERSION_ID /etc/os-release; dnf -y install gcc gcc-c++ make openssl-devel pkgconf-pkg-config git curl-minimal tar gzip; if [ ! -x /workspace/.cache/cargo/bin/rustup ]; then curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain ${RUST_TOOLCHAIN}; else /workspace/.cache/cargo/bin/rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal; /workspace/.cache/cargo/bin/rustup default ${RUST_TOOLCHAIN}; fi; export PATH=/workspace/.cache/cargo/bin:\$PATH; rustc -V; cargo -V; cd debot; cargo build --release --locked --bin engine_b_live --bin book-runtime; chown -R \${HOST_UID}:\${HOST_GID} /workspace/debot/target /workspace/.cache/cargo /workspace/.cache/rustup"

      - name: Fix cargo cache permissions
        if: steps.build_debot.outcome == 'success'
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            sudo chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          else
            chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          fi

      - name: Save cargo cache (native arm64)
        if: steps.build_debot.outcome == 'success' && steps.cache_cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lighter-${{ env.RUST_TOOLCHAIN }}-${{ steps.build_image.outputs.cache_key }}-${{ hashFiles('debot/Cargo.lock') }}

      - name: Verify dynamic links in AL2023
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}/debot/target/release/engine_b_live:/artifacts/engine_b_live:ro" -v "${{ github.workspace }}/debot/target/release/book-runtime:/artifacts/book-runtime:ro" -v "${{ github.workspace }}/lighter-go/build/libsigner.so:/artifacts/libsigner.so:ro" -e LD_LIBRARY_PATH=/artifacts ${AL2023_IMAGE_RESOLVED} /bin/bash -lc "set -euo pipefail; for bin in engine_b_live book-runtime; do if ldd /artifacts/\$bin | grep -q 'not found'; then exit 1; fi; ldd /artifacts/\$bin; done; if ldd /artifacts/libsigner.so | grep -q 'not found'; then exit 1; fi; ldd /artifacts/libsigner.so"

      - name: Package artifacts
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist/bin dist/lib
          file debot/target/release/engine_b_live | grep -q aarch64
          file debot/target/release/book-runtime | grep -q aarch64
          file lighter-go/build/libsigner.so | grep -q aarch64
          # bot-strategy#866: minimal-notional live-experiment binary,
          # NOT the validated Phase 1/2 implementation -- see
          # docs/engine-b-live-operations.md.
          install -m 0755 debot/target/release/engine_b_live dist/bin/engine_b_live
          # bot-strategy#937: book runtime (XSMOM / Engine B host). Built
          # and uploaded here; host installation is a separate, manual step
          # (docs/book-runtime.md §10) until a deploy job exists for it.
          install -m 0755 debot/target/release/book-runtime dist/bin/book_runtime
          install -m 0644 lighter-go/build/libsigner.so dist/lib/libsigner.so
          test "$(stat -c %a dist/bin/engine_b_live)" = 755
          test "$(stat -c %a dist/bin/book_runtime)" = 755
          test "$(stat -c %a dist/lib/libsigner.so)" = 644
          ENGINE_B_LIVE_SHA256=$(sha256sum dist/bin/engine_b_live | cut -d " " -f1)
          BOOK_RUNTIME_SHA256=$(sha256sum dist/bin/book_runtime | cut -d " " -f1)
          LIBSIGNER_SHA256=$(sha256sum dist/lib/libsigner.so | cut -d " " -f1)
          CARGO_LOCK_SHA256=$(sha256sum debot/Cargo.lock | cut -d " " -f1)
          DEX_CONNECTOR_SHA=$(git -C dex-connector rev-parse HEAD)
          (cd dist && sha256sum bin/engine_b_live bin/book_runtime lib/libsigner.so > checksums.sha256)
          jq -n \
            --arg pairtrade_sha "${GITHUB_SHA}" \
            --arg dex_connector_ref "${DEX_CONNECTOR_REF}" \
            --arg dex_connector_sha "${DEX_CONNECTOR_SHA}" \
            --arg cargo_lock_sha256 "${CARGO_LOCK_SHA256}" \
            --arg engine_b_live_sha256 "${ENGINE_B_LIVE_SHA256}" \
            --arg book_runtime_sha256 "${BOOK_RUNTIME_SHA256}" \
            --arg libsigner_sha256 "${LIBSIGNER_SHA256}" \
            --arg rust_toolchain "${RUST_TOOLCHAIN}" \
            --arg build_image "${AL2023_IMAGE_RESOLVED}" \
            --arg github_run_id "${GITHUB_RUN_ID}" \
            --arg github_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{schema_version: 2, architecture: "aarch64", pairtrade_sha: $pairtrade_sha, dex_connector_ref: $dex_connector_ref, dex_connector_sha: $dex_connector_sha, cargo_lock_sha256: $cargo_lock_sha256, rust_toolchain: $rust_toolchain, build_image: $build_image, github_run_id: $github_run_id, github_run_attempt: $github_run_attempt, artifacts: {engine_b_live: {path: "bin/engine_b_live", sha256: $engine_b_live_sha256, mode: "0755"}, book_runtime: {path: "bin/book_runtime", sha256: $book_runtime_sha256, mode: "0755"}, libsigner: {path: "lib/libsigner.so", sha256: $libsigner_sha256, mode: "0644"}}}' > dist/manifest.json
          echo "engine_b_live_sha256=${ENGINE_B_LIVE_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "book_runtime_sha256=${BOOK_RUNTIME_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "libsigner_sha256=${LIBSIGNER_SHA256}" >> "${GITHUB_OUTPUT}"
          (cd dist && sha256sum -c checksums.sha256)
          jq . dist/manifest.json

      - name: Configure AWS credentials
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (github.event_name != 'workflow_dispatch' || inputs.target == 'deploy')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifacts to S3
        id: upload
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (github.event_name != 'workflow_dispatch' || inputs.target == 'deploy')
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          aws s3 cp dist/bin/engine_b_live "s3://${S3_BUCKET}/debot/engine_b_live"
          aws s3 cp dist/lib/libsigner.so "s3://${S3_BUCKET}/debot/libsigner.so"
          # The book runtime ships as an immutable per-commit bundle: its
          # binary and the signer it was built against must never be taken
          # from two independently-updated unversioned keys, or a deploy
          # racing this upload can pair a new binary with the old signer.
          # The pointer is written last, so a reader sees either the
          # previous release or a complete new one. The prefix carries the
          # run id/attempt, not just the SHA: a manual re-run of this
          # workflow for a commit whose release already exists must land
          # at a fresh prefix, or its sequential uploads would overwrite an
          # already-published "immutable" release in place while a reader
          # (deploy-configs.yml, install_book_runtime.sh) fetches it.
          BOOK_PREFIX="debot/book-runtime/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws s3 cp dist/bin/book_runtime "s3://${S3_BUCKET}/${BOOK_PREFIX}/book_runtime"
          aws s3 cp dist/lib/libsigner.so "s3://${S3_BUCKET}/${BOOK_PREFIX}/libsigner.so"
          aws s3 cp dist/manifest.json "s3://${S3_BUCKET}/${BOOK_PREFIX}/manifest.json"
          jq -n --arg sha "${GITHUB_SHA}" --arg prefix "${BOOK_PREFIX}" '{sha: $sha, prefix: $prefix}' > /tmp/book-current.json
          aws s3 cp /tmp/book-current.json "s3://${S3_BUCKET}/debot/book-runtime/current.json"
          echo "book_prefix=${BOOK_PREFIX}" >> "${GITHUB_OUTPUT}"
          aws s3 cp dist/checksums.sha256 "s3://${S3_BUCKET}/debot/checksums.sha256"
          aws s3 cp dist/manifest.json "s3://${S3_BUCKET}/debot/manifest.json"
          # scripts/, configs/ and deploy/ units are NOT uploaded here:
          # deploy-configs.yml is their single owner. This build may finish
          # after a later config-only push has already deployed, and an
          # unversioned re-upload of this commit's copies would roll the
          # host back to older configuration (bot-strategy#937 review).

  deploy-robinhood-lighter:
    name: Deploy Engine B live + book runtime binaries to Robinhood Lighter host
    needs: deploy
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (github.event_name != 'workflow_dispatch' || inputs.target == 'deploy')
    environment: debot
    env:
      AWS_REGION: ap-northeast-1
      INSTALL_DIR: /opt/debot
      INSTANCE_ID: ${{ vars.ROBINHOOD_LIGHTER_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (github.event_name != 'workflow_dispatch' || inputs.target == 'deploy')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Engine B live artifacts via SSM (no start/restart)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
          LIBSIGNER_SHA256: ${{ needs.deploy.outputs.libsigner_sha256 }}
          ENGINE_B_LIVE_SHA256: ${{ needs.deploy.outputs.engine_b_live_sha256 }}
          BOOK_RUNTIME_SHA256: ${{ needs.deploy.outputs.book_runtime_sha256 }}
          BOOK_PREFIX: ${{ needs.deploy.outputs.book_prefix }}
        run: |
          test -n "${INSTANCE_ID}"
          # JSON --parameters file, not inline shorthand: a shorthand
          # `commands="cmd1,cmd2,..."` string can misparse a `KEY=value`
          # pattern embedded after whitespace inside one comma-separated
          # command as a new top-level parameter (see pairtrade#243, which
          # hit exactly this in deploy-configs.yml's sibling job).
          #
          # The frozen Robinhood Chain pairtrade service on this host
          # (`debot-pair-robinhood-lighter`, points farming) is deliberately
          # NOT touched by this job any more: its binary, config, and units
          # stay exactly as last deployed (bot-strategy#937 sunset decision).
          #
          # The book runtime's sources are staged in a per-run /tmp dir, not
          # in the shared /opt/debot tree: deploy-configs.yml can be inside
          # install_book_runtime.sh at the same time, and writing the shared
          # paths outside that script's flock could let it stage a mixed
          # binary/signer pair.
          cat > /tmp/ssm-robinhood-deploy-params.json <<'JSON'
          {
            "commands": [
              "set -e",
              "# /tmp on this host is a ~900M tmpfs -- i.e. RAM on a 1.8G box -- and the staging dir below is disposable once install_book_runtime.sh has promoted it into __INSTALL_DIR__. Leaving one 43M dir per master push behind filled it in about two days and broke this very step with ENOSPC (2026-09-09). A trap, not a delete at the end: `set -e` means any step above can abort the script, and it was exactly the failing runs that leaked. Same pattern the arcus deploys already use.",
              "trap 'rm -rf /tmp/book-runtime-__BOOK_STAGE__ || true' EXIT",
              "# Before the downloads, not after: once /tmp is full the fetch below fails and `set -e` ends the script, so a prune placed at the end can never be the thing that recovers it. -regex matches the whole generated shape -- <40 hex>-<run id>-<attempt> -- rather than a prefix, because [0-9a-f]* would also match a hand-made /tmp/book-runtime-backup.",
              "find /tmp -xdev -maxdepth 1 -type d -regextype posix-extended -regex '/tmp/book-runtime-[0-9a-f]{40}-[0-9]+-[0-9]+' -mmin +60 -exec rm -rf {} + 2>/dev/null || true",
              "sudo install -d -o ec2-user -g ec2-user -m 0750 __INSTALL_DIR__ __INSTALL_DIR__/scripts __INSTALL_DIR__/configs __INSTALL_DIR__/bin __INSTALL_DIR__/deploy",
              "aws s3 sync s3://__S3_BUCKET__/debot/scripts __INSTALL_DIR__/scripts --exclude '*.env'",
              "aws s3 sync s3://__S3_BUCKET__/debot/configs __INSTALL_DIR__/configs",
              "sudo chmod 755 __INSTALL_DIR__/scripts/*.sh",
              "aws s3 cp s3://__S3_BUCKET__/debot/engine_b_live __INSTALL_DIR__/bin/engine_b_live",
              "echo '__ENGINE_B_LIVE_SHA256__  __INSTALL_DIR__/bin/engine_b_live' | sha256sum -c -",
              "sudo chmod 755 __INSTALL_DIR__/bin/engine_b_live",
              "aws s3 cp s3://__S3_BUCKET__/deploy/engine-b-live.service __INSTALL_DIR__/deploy/engine-b-live.service",
              "aws s3 cp s3://__S3_BUCKET__/debot/libsigner.so __INSTALL_DIR__/deploy/engine-b-live-libsigner.so",
              "echo '__LIBSIGNER_SHA256__  __INSTALL_DIR__/deploy/engine-b-live-libsigner.so' | sha256sum -c -",
              "sudo env ENGINE_B_LIVE_LIBSIGNER_SOURCE=__INSTALL_DIR__/deploy/engine-b-live-libsigner.so bash __INSTALL_DIR__/scripts/install_engine_b_live.sh",
              "/bin/bash -lc 'set -e; d=/tmp/book-runtime-__BOOK_STAGE__; units=\"book-runtime-xsmom-695.service book-signal-fetch-xsmom-695.service book-signal-fetch-xsmom-695.timer\"; probe=__INSTALL_DIR__/scripts/s3_object_present.sh; fetch=__INSTALL_DIR__/scripts/fetch_book_bundle.sh; published=1; if [ -x $probe ] && [ -x $fetch ]; then for u in $units; do rc=0; bash $probe __S3_BUCKET__ deploy/$u || rc=$?; if [ $rc -eq 10 ]; then published=0; elif [ $rc -ne 0 ]; then exit $rc; fi; done; else published=0; fi; if [ $published -eq 0 ] || [ ! -f __INSTALL_DIR__/scripts/install_book_runtime.sh ] || [ ! -f __INSTALL_DIR__/configs/book/xsmom-695.yaml ]; then echo \"book runtime units/config/installer not published yet; deploy-configs.yml bootstraps it from the versioned bundle uploaded above\"; else bash $fetch __S3_BUCKET__ $d __BOOK_PREFIX__; for u in $units; do aws s3 cp s3://__S3_BUCKET__/deploy/$u $d/$u; done; aws s3 cp s3://__S3_BUCKET__/debot/configs/book/xsmom-695.yaml $d/xsmom-695.yaml; aws s3 cp s3://__S3_BUCKET__/debot/scripts/book_signal_fetch.sh $d/book_signal_fetch.sh; sudo env BOOK_INSTANCE=xsmom-695 BOOK_BINARY_SOURCE=$d/book_runtime BOOK_LIBSIGNER_SOURCE=$d/libsigner.so BOOK_CONFIG_SOURCE=$d/xsmom-695.yaml BOOK_FETCH_SCRIPT_SOURCE=$d/book_signal_fetch.sh BOOK_UNIT_SOURCE_DIR=$d bash __INSTALL_DIR__/scripts/install_book_runtime.sh; fi'"
            ]
          }
          JSON
          test -n "${BOOK_PREFIX}"
          sed -i "s|__INSTALL_DIR__|${INSTALL_DIR}|g; s|__S3_BUCKET__|${S3_BUCKET}|g; s|__LIBSIGNER_SHA256__|${LIBSIGNER_SHA256}|g; s|__ENGINE_B_LIVE_SHA256__|${ENGINE_B_LIVE_SHA256}|g; s|__BOOK_RUNTIME_SHA256__|${BOOK_RUNTIME_SHA256}|g; s|__GITHUB_SHA__|${GITHUB_SHA}|g; s|__BOOK_PREFIX__|${BOOK_PREFIX}|g; s|__BOOK_STAGE__|${BOOK_PREFIX##*/}|g" /tmp/ssm-robinhood-deploy-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Engine B live + book runtime artifacts; no start or restart" \
            --parameters file:///tmp/ssm-robinhood-deploy-params.json \
            --query Command.CommandId --output text)
          set +e
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
          WAIT_STATUS=$?
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
          set -e
          if [ ${WAIT_STATUS} -ne 0 ]; then
            exit ${WAIT_STATUS}
          fi
