name: Rust CI

on:
  push:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/**"
      # configs/** lives in deploy-configs.yml's trigger list — that
      # workflow handles config-only pushes in 30 s. ci.yml's heavy
      # arm64 Rust build only fires when actual code or workflow
      # files change. A combined push that touches both src/ and
      # configs/ still fires ci.yml via src/**, and ci.yml's deploy
      # step uploads configs as part of its full pipeline.
  workflow_dispatch:
    inputs:
      dex_connector_ref:
        description: "Dex-connector ref/tag (optional)"
        required: false
        type: string

concurrency:
  group: debot-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  INSTALL_DIR: /opt/debot
  DEX_CONNECTOR_REF: v4.7.7
  LIGHTER_GO_REF: v1.0.2
  AL2023_IMAGE: public.ecr.aws/amazonlinux/amazonlinux:2023

jobs:
  # bot-strategy#269: the trading bot must be restarted manually only.
  # Auto-restart from CI force-closes open positions inside systemd's 90s
  # TimeoutStopSec window. Lint every workflow file on every push so a
  # regression here fails the build before deploy can run. The sidecar
  # `lighter-ratelimit` (no exchange position) is exempt and intentionally
  # not matched by this pattern.
  lint-no-bot-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Forbid bot auto-restart in CI workflows
        # bot-strategy#376 exception: debot-pair-canary is explicitly allowed
        # to auto-restart on every deploy — that is the canary's design
        # purpose (always run the latest binary so regressions are detected
        # via main-vs-canary trade divergence). The canary holds at most
        # ~$50 collateral so a brief restart-time force-close is bounded
        # loss. Main bots (debot-pair-btceth, debot-pair-btceth-extended)
        # remain manual-restart-only per bot-strategy#269.
        run: |
          if grep -nE 'systemctl[[:space:]]+(restart|start)[[:space:]]+debot-pair-(btceth|extended)([[:space:]]|$)' .github/workflows/*.yml; then
            echo "::error::CI workflow contains forbidden 'systemctl restart/start debot-pair-(btceth|extended)' — main bots must be restarted manually only (bot-strategy#269). Canary (debot-pair-canary) is the only exception."
            exit 1
          fi

  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      dex_connector_ref: ${{ steps.resolve.outputs.dex_connector_ref }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
    steps:
      - name: Resolve dex-connector ref
        id: resolve
        env:
          DEFAULT_REF: ${{ env.DEX_CONNECTOR_REF }}
          INPUT_REF: ${{ github.event.inputs.dex_connector_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          default_ref = os.environ.get("DEFAULT_REF", "").strip()
          input_ref = (os.environ.get("INPUT_REF") or "").strip()
          token = os.environ.get("GH_TOKEN", "")

          ref = input_ref or default_ref
          # Release pins continue to float to the latest published tag. A
          # non-release ref is an intentional draft integration pin and must
          # not be overwritten by tag discovery.
          if not input_ref and default_ref.startswith("v"):
              try:
                  req = urllib.request.Request(
                      "https://api.github.com/repos/shigeo-nakamura/dex-connector/tags?per_page=1",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.load(resp)
                  if data and "name" in data[0]:
                      ref = data[0]["name"]
              except Exception:
                  pass

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"dex_connector_ref={ref}\n")
              f.write(f"should_deploy=true\n")
          PY

  build-test:
    needs: resolve-ref
    if: needs.resolve-ref.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      DEX_CONNECTOR_REF: ${{ needs.resolve-ref.outputs.dex_connector_ref }}
      LIGHTER_GO_PATH: ${{ github.workspace }}/lighter-go
      LD_LIBRARY_PATH: ${{ github.workspace }}/lighter-go
    defaults:
      run:
        working-directory: debot
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ env.DEX_CONNECTOR_REF }}
          path: dex-connector
          token: ${{ secrets.DEX_CONNECTOR_PAT || github.token }}

      - name: Checkout lighter-go
        uses: actions/checkout@v5
        with:
          repository: elliottech/lighter-go
          ref: ${{ env.LIGHTER_GO_REF }}
          path: lighter-go

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: lighter-go/go.sum

      - name: Build libsigner
        run: go build -buildmode=c-shared -trimpath -o libsigner.so ./sharedlib
        working-directory: ${{ github.workspace }}/lighter-go

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            debot -> target

      - name: Cargo check
        run: cargo check --all-targets --locked

      - name: Cargo test
        run: cargo test --all-targets --locked

      - name: Arcus Spot feature check
        run: cargo check --all-targets --no-default-features --features arcus-spot-sdk --locked

      - name: Arcus Spot runtime tests
        run: cargo test --lib --no-default-features --features arcus-spot-sdk arcus_spot --locked

      # `--lib` above only tests the library target; the arcus-spot-runtime
      # binary (required-features = ["arcus-spot-sdk"]) is excluded from it
      # and from the default-feature `cargo test --all-targets` above, so
      # its own tests -- including the same_file alias-detection guards
      # against silently truncating the recorder archive or config -- never
      # actually ran in CI (Codex P2 follow-up, pairtrade#177).
      - name: Arcus Spot runtime binary tests
        run: cargo test --bin arcus-spot-runtime --no-default-features --features arcus-spot-sdk --locked

  deploy:
    runs-on: ubuntu-latest
    # CI ships new binary + configs but no longer restarts the service
    # (pairtrade#9). Operators restart debot-pair-btceth manually when
    # convenient, so the SSM step finishes in seconds and does not need
    # to cover the 2h graceful-shutdown window.
    #
    # bot-strategy#343 added aws-sdk-s3 to the dep tree which inflated
    # the QEMU emulated arm64 cargo build past the original 60min cap;
    # bumped to 180 to leave headroom for future SDK-sized additions.
    timeout-minutes: 180
    needs: [resolve-ref, build-test, lint-no-bot-restart]
    if: needs.resolve-ref.outputs.should_deploy == 'true' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment: debot
    env:
      DEX_CONNECTOR_REF: ${{ needs.resolve-ref.outputs.dex_connector_ref }}
    steps:
      - name: Checkout debot
        uses: actions/checkout@v5
        with:
          path: debot

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Checkout dex-connector
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/dex-connector
          ref: ${{ env.DEX_CONNECTOR_REF }}
          path: dex-connector
          token: ${{ secrets.DEX_CONNECTOR_PAT || github.token }}

      - name: Checkout lighter-go
        uses: actions/checkout@v5
        with:
          repository: elliottech/lighter-go
          ref: ${{ env.LIGHTER_GO_REF }}
          path: lighter-go

      - name: Cache libsigner (linux/arm64)
        id: cache_libsigner
        uses: actions/cache@v5
        with:
          path: lighter-go/build/libsigner.so
          key: ${{ runner.os }}-libsigner-${{ env.LIGHTER_GO_REF }}-${{ hashFiles('lighter-go/go.sum') }}

      - name: Build libsigner (linux/arm64)
        if: steps.cache_libsigner.outputs.cache-hit != 'true'
        run: |
          mkdir -p lighter-go/build
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}/lighter-go:/go/src/sdk" \
            -w /go/src/sdk \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            ${AL2023_IMAGE} \
            /bin/bash -lc "dnf -y install golang gcc && CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -buildvcs=false -buildmode=c-shared -trimpath -o ./build/libsigner.so ./sharedlib && chown -R ${HOST_UID}:${HOST_GID} /go/src/sdk/build"

      - name: Save libsigner cache (linux/arm64)
        if: steps.cache_libsigner.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: lighter-go/build/libsigner.so
          key: ${{ runner.os }}-libsigner-${{ env.LIGHTER_GO_REF }}-${{ hashFiles('lighter-go/go.sum') }}

      - name: Cache cargo (linux/arm64)
        id: cache_cargo
        uses: actions/cache@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('debot/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arm64-

      - name: Build debot (linux/arm64)
        id: build_debot
        run: |
          mkdir -p .cache/cargo/registry .cache/cargo/git .cache/cargo/bin .cache/rustup debot/target
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_HOME=/workspace/.cache/cargo \
            -e RUSTUP_HOME=/workspace/.cache/rustup \
            -e CARGO_INCREMENTAL=0 \
            -e LIGHTER_GO_PATH=/workspace/lighter-go/build \
            -e LD_LIBRARY_PATH=/workspace/lighter-go/build \
            ${AL2023_IMAGE} \
            /bin/bash -lc "set -euo pipefail; dnf -y install gcc gcc-c++ make openssl-devel pkgconf-pkg-config git curl-minimal tar gzip; if [ ! -x /workspace/.cache/cargo/bin/rustup ]; then curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable; fi; export PATH=/workspace/.cache/cargo/bin:\$PATH; rustc -V; cargo -V; cd debot && cargo build --release --locked; chown -R ${HOST_UID}:${HOST_GID} /workspace/debot/target /workspace/.cache/cargo /workspace/.cache/rustup"

      - name: Fix cargo cache permissions
        if: steps.build_debot.outcome == 'success'
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            sudo chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          else
            chown -R "$(id -u):$(id -g)" .cache/cargo .cache/rustup debot/target
            chmod -R u+rwX,go+rX .cache/cargo .cache/rustup debot/target
          fi

      - name: Save cargo cache (linux/arm64)
        if: steps.build_debot.outcome == 'success' && steps.cache_cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/cargo/registry
            .cache/cargo/git
            .cache/cargo/bin
            .cache/rustup
            debot/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('debot/Cargo.lock') }}

      - name: Package artifacts
        run: |
          mkdir -p dist/bin dist/lib dist/scripts dist/configs
          cp debot/target/release/debot dist/bin/debot
          cp lighter-go/build/libsigner.so dist/lib/libsigner.so
          rsync -a \
            --exclude "venv/" \
            --exclude "__pycache__/" \
            --exclude "*.log" \
            --exclude "*.pyc" \
            debot/scripts/ dist/scripts/
          rsync -a debot/configs/ dist/configs/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifacts to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
        run: |
          aws s3 cp dist/bin/debot "s3://${S3_BUCKET}/debot/debot"
          aws s3 cp dist/lib/libsigner.so "s3://${S3_BUCKET}/debot/libsigner.so"
          aws s3 sync dist/scripts/ "s3://${S3_BUCKET}/debot/scripts/" \
            --exclude "venv/*" \
            --exclude "venv/**" \
            --exclude "__pycache__/*" \
            --exclude "__pycache__/**" \
            --exclude "*.log" \
            --exclude "*.pyc"
          aws s3 sync dist/configs/ "s3://${S3_BUCKET}/debot/configs/"
          aws s3 cp debot/deploy/debot-pair-btceth.service "s3://${S3_BUCKET}/deploy/debot-pair-btceth.service"
          # Canary unit (bot-strategy#376) — Frankfurt-only, deployed by this
          # same job.
          aws s3 cp debot/deploy/debot-pair-canary.service "s3://${S3_BUCKET}/deploy/debot-pair-canary.service"

      - name: Deploy via SSM (no restart)
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
          INSTANCE_ID: ${{ secrets.INSTANCE_ID || vars.INSTANCE_ID }}
        run: |
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "sudo mkdir -p __INSTALL_DIR__/bin __INSTALL_DIR__/lib __INSTALL_DIR__/scripts __INSTALL_DIR__/configs",
              "aws s3 cp s3://__S3_BUCKET__/debot/debot __INSTALL_DIR__/bin/debot",
              "sudo chmod 755 __INSTALL_DIR__/bin/debot",
              "aws s3 cp s3://__S3_BUCKET__/debot/libsigner.so __INSTALL_DIR__/lib/libsigner.so",
              "sudo chmod 644 __INSTALL_DIR__/lib/libsigner.so",
              "aws s3 sync s3://__S3_BUCKET__/debot/scripts __INSTALL_DIR__/scripts",
              "aws s3 sync s3://__S3_BUCKET__/debot/configs __INSTALL_DIR__/configs",
              "sudo chmod 755 __INSTALL_DIR__/scripts/*.sh",
              "/bin/bash -lc 'set -e; UPDATED=0; for svc in debot-pair-btceth debot-pair-canary; do aws s3 cp s3://__S3_BUCKET__/deploy/$svc.service /tmp/$svc.service; if [ ! -f /etc/systemd/system/$svc.service ] || ! cmp -s /etc/systemd/system/$svc.service /tmp/$svc.service; then sudo mv /tmp/$svc.service /etc/systemd/system/$svc.service; UPDATED=1; else rm /tmp/$svc.service; fi; done; if [ $UPDATED -eq 1 ]; then sudo systemctl daemon-reload; fi'",
              "sudo mkdir -p /opt/debot-canary/history_archive && sudo chown -R ec2-user:ec2-user /opt/debot-canary"
            ]
          }
          JSON
          sed -i "s|__INSTALL_DIR__|${INSTALL_DIR}|g; s|__S3_BUCKET__|${S3_BUCKET}|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy debot" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          # No service restart in the SSM commands above, so the command
          # finishes as soon as the S3 pulls + daemon-reload complete.
          # 30 minutes is ample for S3 transfers + SSM scheduling latency.
          SSM_DEPLOY_TIMEOUT_SECS=${SSM_DEPLOY_TIMEOUT_SECS:-1800}
          POLL_INTERVAL_SECS=30
          deadline=$(( $(date +%s) + SSM_DEPLOY_TIMEOUT_SECS ))
          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
                exit 0 ;;
              Cancelled|TimedOut|Failed)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
                echo "##[error]SSM command finished with status ${STATUS}"
                exit 1 ;;
              Pending|InProgress|Delayed)
                : ;;
              *)
                echo "Unexpected SSM status: ${STATUS}" ;;
            esac
            if [ $(date +%s) -ge ${deadline} ]; then
              aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text || true
              echo "##[error]Deploy polling timed out after ${SSM_DEPLOY_TIMEOUT_SECS}s (last status: ${STATUS})"
              exit 1
            fi
            echo "deploy in progress (status=${STATUS}), sleeping ${POLL_INTERVAL_SECS}s..."
            sleep ${POLL_INTERVAL_SECS}
          done

      - name: Restart canary (bot-strategy#376)
        # Canary is the only debot-pair-* unit allowed to auto-restart on every
        # deploy — that is its design purpose (always run the latest binary so
        # regressions surface via main-vs-canary trade-rate divergence). Main
        # bots remain manual-restart per bot-strategy#269.
        # continue-on-error: a missing env file on first-deploy of a new host
        # is expected to fail this step; bootstrap is operator-driven
        # (host-managed env files, per bot-strategy#357 *.env exclusion).
        # Subsequent runs restart cleanly once /opt/debot/scripts/debot-pair-canary.env
        # exists on the host.
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID || vars.INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Restart canary (bot-strategy#376 exception)" \
            --parameters 'commands=["sudo systemctl restart debot-pair-canary","sleep 10","systemctl is-active debot-pair-canary","sudo journalctl -u debot-pair-canary --no-pager -n 20"]' \
            --query "Command.CommandId" \
            --output text)
          RESTART_TIMEOUT_SECS=180
          deadline=$(( $(date +%s) + RESTART_TIMEOUT_SECS ))
          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
                exit 0 ;;
              Cancelled|TimedOut|Failed)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
                echo "##[warning]Canary restart status=${STATUS} (non-fatal, see #376)"
                exit 1 ;;
              Pending|InProgress|Delayed)
                : ;;
            esac
            if [ $(date +%s) -ge ${deadline} ]; then
              echo "##[warning]Canary restart polling timed out (non-fatal)"
              exit 1
            fi
            sleep 10
          done

  # Tokyo Lighter (bot-strategy#218) deploy job was removed 2026-05-18
  # under bot-strategy#433. The Tokyo Lighter A/B/C bot stayed in DRY_RUN
  # throughout its life and is being decommissioned alongside the
  # debot-tokyo instance teardown. Frankfurt Lighter (A/B/C on
  # i-0c08fba996bc21879) remains the only Lighter pairtrade fleet, served
  # by the `deploy` job above.
  #
  # The Tokyo Extended deploy job (debot-pair-btceth-extended) was removed
  # 2026-06-13 under bot-strategy#543 — Extended pairtrade was sunset
  # 2026-06-12 and the debot-tokyo instance terminated, so SSM SendCommand
  # to TOKYO_INSTANCE_ID failed with InvalidInstanceId on every master push.
