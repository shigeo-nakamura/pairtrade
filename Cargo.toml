[package]
name = "debot"
version = "6.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
async-trait = "0.1.68"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
chrono = "0.4.24"
env_logger = "0.10.0"
log = "0.4.17"
lazy_static = "1.4.0"
rust_decimal = { version = "1.0", features = ["serde"] }
rust_decimal_macros = "1.0"
lettre = "0.11.9"
once_cell = "1.19"
rand = { version = "0.8", features = ["std", "std_rng"] }
bincode = "1.3"
libc = "0.2"
fs2 = "0.4"
# Optional S3 mirror for the status writer (bot-strategy#343). Engaged only
# when STATUS_S3_BUCKET / STATUS_S3_KEY_PREFIX env vars are set; without
# them the writer stays local-only and the SDK is dead code at runtime.
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = "1"

# In-process Prometheus exporter (bot-strategy#314 / #409). Always
# initialised; the HTTP server is bound only when `PROM_LISTEN` is set in
# the env, otherwise the gauges are updated as dead code.
prometheus = { version = "0.13", default-features = false }

# Effective-config fingerprinting (bot-strategy#580): short sha256 over the
# resolved per-variant trading params + the on-disk config file, surfaced in
# the [CONFIG] startup line and Prometheus so a config deployed-but-not-loaded
# (deploy ≠ restart) is detectable within minutes. Already in the tree
# transitively; this only promotes it to a direct dep.
sha2 = "0.10"
ethers = { version = "2.0.14", default-features = false, features = ["abigen", "eip712", "rustls"], optional = true }
rusoto_core = { version = "0.48", optional = true }
rusoto_kms = { version = "0.48", optional = true }
k256 = { version = "0.13.3", optional = true }
spki = { version = "0.7.2", optional = true }
thiserror = { version = "1", optional = true }
url = { version = "2", optional = true }
# Verifies the offline-signed one-swap approval (bot-strategy#772,
# pairtrade#181): the execute/resume CLI holds only the Ed25519 public key,
# never the signing key, so it cannot mint its own approval.
ed25519-dalek = { version = "2.2", optional = true }
hex = { version = "0.4", optional = true }
# Passphrase-encrypts the offline keygen/sign-approval private key at rest
# (bot-strategy#772): argon2 derives a symmetric key from the passphrase,
# aes-gcm encrypts the raw Ed25519 seed with it, rpassword reads the
# passphrase from a TTY without echoing or leaking it via argv/env, and
# zeroize wipes the decrypted key and derived symmetric key from memory
# immediately after use.
argon2 = { version = "0.5", optional = true }
aes-gcm = { version = "0.10", optional = true }
zeroize = { version = "1", optional = true }
rpassword = { version = "7", optional = true }
debot-utils = "1.0.*"

dex-connector = { path = "../dex-connector", default-features = false }

reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["lighter-sdk"]
lighter-sdk = ["dex-connector/lighter-sdk"]
# Tokyo deployments build with `--no-default-features --features extended-sdk`
# (no Go/libsigner toolchain on ARM). Frankfurt keeps the default.
extended-sdk = ["dex-connector/extended-sdk"]
arcus-sdk = ["dex-connector/arcus-sdk"]
arcus-spot-sdk = ["dex-connector/arcus-spot-sdk"]
arcus-spot-live = [
    "arcus-spot-sdk",
    "dex-connector/arcus-spot-execution",
    "dep:ethers",
    "dep:rusoto_core",
    "dep:rusoto_kms",
    "dep:k256",
    "dep:spki",
    "dep:thiserror",
    "dep:url",
    "dep:ed25519-dalek",
    "dep:hex",
    "dep:argon2",
    "dep:aes-gcm",
    "dep:zeroize",
    "dep:rpassword",
]
hyperliquid-sdk = ["dex-connector/hyperliquid-sdk"]

[[bin]]
name = "debot"
path = "src/main.rs"

[[bin]]
name = "bull-holder"
path = "src/bin/bull_holder.rs"
required-features = ["lighter-sdk", "hyperliquid-sdk"]

[[bin]]
name = "convert-data"
path = "src/bin/convert_data.rs"

[[bin]]
name = "arcus-spot-runtime"
path = "src/bin/arcus_spot_runtime.rs"
required-features = ["arcus-spot-sdk"]

[[bin]]
name = "arcus-spot-execute-once"
path = "src/bin/arcus_spot_execute_once.rs"
required-features = ["arcus-spot-live"]

[[bin]]
name = "arcus-spot-propose-plan"
path = "src/bin/arcus_spot_propose_plan.rs"
required-features = ["arcus-spot-live"]
