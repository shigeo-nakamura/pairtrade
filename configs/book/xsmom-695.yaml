# Book runtime config for the XSMOM shadow → DRY_RUN track (bot-strategy#695 /
# #937). Copy to the host as /opt/book-runtime/xsmom-695.yaml. Everything
# here is reviewable in a PR diff; credentials never live in this file.
#
# scripts/xsmom_signal_producer.py writes the signal on every rebalance day
# right after the 00:20 UTC shadow run (via S3 + book-signal-fetch timer);
# the runtime reads it inside the 00:30 + 90 min window.
schema_version: 1
instance_id: xsmom-695
venue: lighter
dry_run: true

universe:
  # The runtime rejects any signal naming a symbol outside this list, so it
  # must cover everything the producer's point-in-time screen can admit.
  # That screen is deliberately dynamic (it re-screens every rebalance to
  # keep survivorship out of the shadow track, bot-strategy#695): the
  # liquidity filters (24h volume, spread, depth) move daily, but the pool
  # they select from -- Lighter markets that are active, not hidden, not
  # reduce-only, not session-gated, intersected with Binance USDT
  # perpetuals on a COIN underlying -- only moves on a listing or a
  # delisting. This list is that whole pool (109 symbols on 2026-09-11),
  # not the frozen L38 snapshot and not the union of past books: covering
  # past books alone missed the 2026-09-11 decision when ARB and OP
  # crossed the volume bar that morning (bot-strategy#941).
  #
  # Refresh with `scripts/xsmom_universe_pool.py --check` (exit 1 names
  # the missing symbols) after a Lighter listing; a delisted market can
  # stay listed here so a leg the book still holds keeps its price feed.
  # `xsmom_signal_producer.py --config` still cross-checks against this
  # file and refuses to publish a signal the runtime would reject.
  symbols:
    - 0G
    - 1000BONK
    - 1000FLOKI
    - 1000PEPE
    - 1000SHIB
    - 2Z
    - AAVE
    - ADA
    - AERO
