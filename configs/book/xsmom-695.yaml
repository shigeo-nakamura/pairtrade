schedule:
  kind: interval_days
  anchor_date: 2026-07-03          # first shadow book (#695)
  every_days: 5                    # hold 5 days (L28_H5_q20_riskadj)
  decision_time_utc: "00:30"
  signal_grace_secs: 5400

signal:
  path: /var/lib/book-runtime/xsmom-695/signal.json
  producer_id: xsmom_695_L28_H5_q20_riskadj
  max_age_secs: 7200
  require_dollar_neutral: true
  net_tolerance: 0.05

sizing:
  gross_notional_usd: 1000         # same $1000 gross as the shadow book
  max_symbol_weight: 0.15          # q20 on ~38 names → ~8 per side, ~0.0625 each
  max_gross_usd: 1100
  max_net_usd: 150
  min_order_usd: 10
  rebalance_deadband_usd: 5

execution:
  # allow_venue_protection_fallback stays at its default false, for live
  # as well as DRY_RUN. Up to dex-connector v4.7.21 Lighter had no
  # price-capped IOC and going live meant opting into the venue's own
  # +/-20% protection price; v4.7.22 (bot-strategy#918) implements
  # create_order_taker_ioc for Lighter, so slippage_bps below is what
  # actually bounds a fill and the fallback would only widen it.
  # slippage_bps is a bound against the mid, same as paper_slippage_bps;
  # the runtime nets out the half-spread before handing it to the venue
  # (bot-strategy#971), so a torn book refuses an entry instead of
  # widening the cap.
  slippage_bps: 50
  max_attempts: 3
  fill_confirm_timeout_secs: 15
  paper_slippage_bps: 5            # shadow used opposite-touch fills; 5 bps ≈ L38 median half-spread
  paper_fee_bps: 0

risk:
  equity_reference_usd: 1000
  max_session_loss_bps: 1500       # S2 gate on #695 is max DD ≤ $150
  max_daily_loss_bps: 500
  kill_switch_path: /var/lib/book-runtime/xsmom-695/KILL_SWITCH
  risk_ack_path: /var/lib/book-runtime/xsmom-695/RISK_ACK

paths:
  state: /var/lib/book-runtime/xsmom-695/state.json
  ledger: /var/lib/book-runtime/xsmom-695/ledger.jsonl
  pnl: /var/lib/book-runtime/xsmom-695/pnl.jsonl
  status: /var/lib/book-runtime/xsmom-695/status.json
