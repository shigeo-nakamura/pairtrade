dex_name: lighter
rest_endpoint: https://mainnet.zklighter.elliot.ai/
web_socket_endpoint: wss://mainnet.zklighter.elliot.ai/stream
dry_run: false
agent_name: debot-pair-btceth

# Data dump for BT (independent of trading; observe_only must be set explicitly)
enable_data_dump: true
data_dump_file: /opt/debot/market_data_btceth.jsonl
observe_only: false

# Hourly snapshot archive for BT replay warm-start (#69)
# 360 days retention ≈ 168 MB / 8640 files — covers year-long replays and
# ad-hoc historical analysis at trivial disk cost.
history_archive_dir: /opt/debot/history_archive
history_archive_retention_days: 360

# Fixed pair: BTC/ETH only
universe_pairs:
- BTC/ETH
max_active_pairs: 1

# Timing
interval_secs: 5
trading_period_secs: 60

# Pair diagnostics (simplified: relaxed thresholds)
pair_selection_lookback_hours_short: 1
pair_selection_lookback_hours_long: 2
adf_p_threshold: 0.15
half_life_max_hours: 2.0
metrics_window_length: 240
warm_start_mode: relaxed
warm_start_min_bars: 60

# Core MR params (Bot C champion params, swapped in 2026-04-07: was exit_z=0.3, sl_z=6.0)
entry_z_score_base: 1.5
entry_z_score_min: 1.0
entry_z_score_max: 2.0
exit_z_score: 0.2
stop_loss_z_score: 4.0
force_close_time_secs: 3600
shutdown_grace_secs: 10860  # max(force_close_time_secs across strategies) + 60s buffer. Round 4 (#278): B overrides to 10800 (FC%-attack from #70 Phase A 5d signal); A and C stay at 7200. Grace must cover 10800 + 60. See bot-strategy#50.

# Post-stop cool-down (#316, recalibrated in #362). The 35-day byte-exact
# sweep (2026-05-04 through 2026-06-07) found 300 s preserved the full
# cooldown=0 trade set while still blocking immediate same-direction checks.
# 600 s removed a profitable 2026-06-01 re-entry and reduced Calmar.
stop_loss_cooldown_secs: 300

# Risk
risk_pct_per_trade: 0.40
# Fixed equity reference for thresholds and sizing (bot-strategy#222). Revised
# at the same monthly cadence as A/B/C parameter updates; live equity drift is
# no longer mixed into the calculation, so daily-DD denominator and risk_budget
# stay constant within the month. Top-level value is only the fallback for any
# strategy that omits the per-instance field — each Frankfurt instance overrides
# it below.
equity_usd_reference: 1000
max_leverage: 10  # Round 4 (#278) bumped from 5. bps-based risk gates are leverage-invariant.
max_loss_r_mult: 1.0    # Bot C champion value (was 3.0). Swapped 2026-04-07.

# Execution
cooldown_secs: 60
slippage_bps: 0
fee_bps: 0
entry_post_only_timeout_secs: 30

# Filters (relaxed: let z-score do the work)
spread_velocity_max_sigma_per_min: 0.15
spread_trend_max_slope_sigma: 1.0
beta_divergence_max: 0.30
beta_min: 0.30
hedge_ratio_max_deviation: 0.20
entry_vol_lookback_hours: 2
vol_spike_mult: 3.0
net_funding_min_per_hour: -0.01
reeval_jump_z_mult: 1.5

# Phase 2 filters (BT 2026-04-05: beta_gap=3.0 best, +$0.84 vs baseline +$0.20)
entry_velocity_block_sigma_per_min: 0.0
funding_entry_z_scale: 0.0
beta_gap_entry_z_scale: 3.0

# Std collapse guard (bot-strategy#62). Root cause (warm_start single-OLS-beta
# artifact) was fixed via snapshot v2 spread_history persistence. Guard remains
# as a hard gate against real-market std collapse: blocks entries when
# std < 20% of the rolling median of the last 60 bar stds. 11-day observe-only
# data (2026-04-16 → 2026-04-27) showed only one ~4h episode with |z| ≤ 1.25
# (no entries blocked), confirming flip-to-block is risk-free.
std_collapse_window_bars: 60
std_collapse_min_ratio: 0.2
std_collapse_observe_only: false

# Circuit breaker
circuit_breaker_tier1_losses: 5
circuit_breaker_tier1_cooldown_secs: 600
circuit_breaker_tier2_losses: 8
circuit_breaker_tier2_cooldown_secs: 3600

# Risk gates (bot-strategy#185). All bps fields are now leverage-invariant:
# the bot multiplies them by max_leverage internally so a single value covers
# any leverage and changing max_leverage does not require rewriting the bps.
# Typical 100–500 bps. See #185 leverage-neutralization amendment.
risk:
  # Phase 2: daily DD cap. 300 bps = halt at 3% equivalent 1x market move
  # (= 15% realized loss against session_start_equity at max_leverage=5,
  # behaviourally equivalent to the pre-amendment 1500 bps). Action `block`
  # refuses new entries while existing positions exit normally, auto-resume
  # at next UTC midnight.
  max_daily_loss_bps: 300
  max_daily_loss_action: block
  daily_reset_utc_hour: 0
  # Phase 3-1: rolling-peak session DD. Sticky halt + auto-flatten of the
  # breaching instance, cleared only by `sudo touch /opt/debot/RISK_ACK`.
  # Round 4 (#278): activated at 50 bps. Effective threshold = 50 × max_leverage(10)
  # = 500 bps DD = 5% equity. Catches the 5/4 cluster (B 448 bps obs at 5x → 896 bps
  # proj at 10x; C 271 → 542 bps proj) while leaving A's normal vol (49 → 98 bps) at 5x
  # headroom. Strawman 100 (= 1000 bps gate) was too loose — would miss B's 5/4.
  max_session_loss_bps: 50
  session_dd_lookback_secs: 2592000  # 30 d
  session_dd_sample_secs: 3600       # 1 h
  # Phase 3-4: per-leg notional cap, expressed as a multiplier of
  # equity_reference_usd × max_leverage. 0 disables, 1.0 = exactly the
  # intended leverage, 1.1 = 10% slack for slippage/rounding while still
  # rejecting bug-driven oversizing. The multiplicative form lets the same
  # value work across A/B/C with different equity and across hosts
  # (Frankfurt $1k×10x → $10k cap, Tokyo Lighter $150×5x → $750 cap at
  # headroom=1.0). Round 4 (#278) flipped from 0 → 1.0.
  max_notional_headroom: 1.0

# Multi-strategy A/B/C variants for the single-process architecture
# (shigeo-nakamura/bot-strategy#25, completed in bot-strategy#413). The
# single `debot-pair-btceth` process spawns one StrategyInstance per
# entry. All instances now share the WS feed, BarBuilder, spread_history,
# β / Kalman state and evaluate_pair cadence at engine level (#413's
# `PairTradeEngine.per_pair_state`), so A/B/C produce byte-identical
# β / std / z for the same tick. Variants only branch on the per-strategy
# overrides below: entry_z / exit_z / stop_loss_z / force_close /
# mtf_windows / equity_usd_reference. Each instance loads its sub-account
# credentials via LIGHTER_*_{A,B,C} env vars set up by
# /opt/debot/scripts/debot-pair-btceth.sh from the legacy per-bot env
# files.
strategies:
  - id: a
    agent_name: debot-pair-btceth-a
    # Round 6 (2026-06-07, bot-strategy#355): A inherits Round-5 B's
    # `force_close_time_secs=10800` winning config — Round-5 outcome
    # showed B (fc=10800) ≈ 2× A's net PnL with +76% Calmar, +84% Sharpe
    # vs the old fc=7200 baseline. Promoted as the new stable best.
    exit_z_score: 0.2
    stop_loss_z_score: 4.0
    max_loss_r_mult: 1.0
    equity_usd_reference: 1000
    mtf_windows: [15]
    mtf_z_min: 0.5
    force_close_time_secs: 10800
  - id: b
    agent_name: debot-pair-btceth-b
    # Round 6 (2026-06-07): B reverts to fc=7200 — the previous A baseline —
    # as the 1-knob control vs new A (fc=10800). Keeps the A/B comparison
    # honest: if Round-6 A underperforms B in a different regime, we know
    # the fc=10800 win was regime-specific rather than structural.
    exit_z_score: 0.2
    stop_loss_z_score: 4.0
    max_loss_r_mult: 1.0
    equity_usd_reference: 1000
    mtf_windows: [15]
    mtf_z_min: 0.5
    force_close_time_secs: 7200
  - id: c
    agent_name: debot-pair-btceth-c
    # Round 6 (2026-06-07, bot-strategy#473): C = A's config +
    # `use_frozen_beta_exit_z=true`. Exit-side z (`exit_z`, `stop_loss_z`,
    # expected-value gate) recomputed against `Position.entry_beta` instead
    # of rolling `shared.beta`, so a β drift between entry and now does
    # not produce false z-reversion exit signals.
    #
    # Round-5 byte-exact BT (5/30→6/07): vs same-config baseline,
    # PnL -$33 → -$5 (+$28 over 8.5 days), MaxDD -36%, per-trade Sharpe
    # +84%, Calmar +76%, `exit_z` close count 10 → 2 (-80%). All Round-6
    # acceptance thresholds passed. Same trade count as baseline (entries
    # unaffected) — only exit timing changes.
    #
    # Round-5 C's substitution-mode + re-hedge config (#461 + #463+#465)
    # is dropped: synthetic analysis + live result showed it underperforms
    # A and halted out on session_dd. Rehedge axis shelved (deferred);
    # substitution mode rejected. Future #473 follow-up #355 if frozen-β
    # alone insufficient.
    exit_z_score: 0.2
    stop_loss_z_score: 4.0
    max_loss_r_mult: 1.0
    equity_usd_reference: 1000
    mtf_windows: [15]
    mtf_z_min: 0.5
    force_close_time_secs: 10800
    use_frozen_beta_exit_z: true
