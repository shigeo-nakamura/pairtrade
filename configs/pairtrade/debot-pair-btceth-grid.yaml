dex_name: lighter
rest_endpoint: https://mainnet.zklighter.elliot.ai/
web_socket_endpoint: wss://mainnet.zklighter.elliot.ai/stream
dry_run: false
agent_name: debot-pair-btceth-grid

enable_data_dump: false
observe_only: false

universe_pairs:
- BTC/ETH
max_active_pairs: 1

interval_secs: 5
trading_period_secs: 60

pair_selection_lookback_hours_short: 1
pair_selection_lookback_hours_long: 2
adf_p_threshold: 0.15
half_life_max_hours: 2.0
metrics_window_length: 240
warm_start_mode: relaxed
warm_start_min_bars: 60

entry_z_score_base: 1.5
# Widened to honour the bot-strategy#70 grid sweep ENTRY_Z_SCORE_BASE
# range of {1.5, 2.0, 2.5, 3.0, 3.5}. With the previous 1.0/2.0 clamp
# applied in entry.rs::effective_entry_z_threshold, ez_base ≥ 2.0
# silently collapsed to 2.0, hiding the deep-entry hypothesis.
entry_z_score_min: 0.5
entry_z_score_max: 5.0
exit_z_score: 0.2
stop_loss_z_score: 4.0
force_close_time_secs: 7200
shutdown_grace_secs: 14460  # max(grid fc_secs)=14400 + 60s buffer (#50)

risk_pct_per_trade: 0.40
equity_usd_reference: 1000
max_leverage: 1
max_loss_r_mult: 1.0

cooldown_secs: 60
slippage_bps: 0
fee_bps: 0
entry_post_only_timeout_secs: 30

spread_velocity_max_sigma_per_min: 0.15
spread_trend_max_slope_sigma: 1.0
beta_divergence_max: 0.30
beta_min: 0.30
hedge_ratio_max_deviation: 0.20
entry_vol_lookback_hours: 2
vol_spike_mult: 3.0
net_funding_min_per_hour: -0.01
reeval_jump_z_mult: 1.5

entry_velocity_block_sigma_per_min: 0.0
funding_entry_z_scale: 0.0
beta_gap_entry_z_scale: 3.0

std_collapse_window_bars: 60
std_collapse_min_ratio: 0.2
std_collapse_observe_only: true

circuit_breaker_tier1_losses: 5
circuit_breaker_tier1_cooldown_secs: 600
circuit_breaker_tier2_losses: 8
circuit_breaker_tier2_cooldown_secs: 3600

# Single strategy "Bot A clone" with MTF on.
# exit_z_score / stop_loss_z_score / force_close_time_secs / max_loss_r_mult
# are intentionally omitted below so each strategy field falls back to
# default_pair_params — which is env-overridable via ENTRY_Z_SCORE_BASE /
# EXIT_Z_SCORE / STOP_LOSS_Z_SCORE / FORCE_CLOSE_TIME_SECS / MAX_LOSS_R_MULT.
# This lets bot-strategy#70's 100-cell grid sweep via env vars instead of
# generating 100 YAMLs.
strategies:
  - id: grid
    agent_name: debot-pair-btceth-grid
    equity_usd_reference: 1000
    mtf_windows: [15]
    mtf_z_min: 0.5
