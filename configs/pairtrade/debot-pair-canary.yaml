# Canary bot config (bot-strategy#376)
#
# Single-variant pairtrade bot for continuous binary-regression detection.
# Runs alongside the main `debot-pair-btceth` A/B/C process on the Frankfurt
# instance, but on a separate Lighter sub-account, with the *latest* binary
# (auto-restarted by CI on every master deploy — explicit exception to the
# bot-strategy#269 manual-restart rule, see ci.yml allowlist).
#
# Design notes:
# - Strategy is a clone of main A (MTF+fc=7200, ez=0.2, sl=4, mlr=1) except
#   entry_z_score_base lowered to 1.0 (vs main A=1.5) to lift trade rate
#   ~2-3x for faster signal accumulation.
# - The primary metric is canary vs main-A trade-rate / per-trade hypothetical
#   PnL divergence over rolling 24h / 7d windows. Absolute PnL is secondary —
#   a small structural difference is expected because entry_z=1.0 is more
#   permissive.
# - equity_usd_reference = 50 (Lighter sub-account collateral matches).
#   max_leverage = 5 (half of main A/B/C Round 4 = 10) so per-leg notional
#   stays modest even if a regression briefly fires bad entries.

dex_name: lighter
rest_endpoint: https://mainnet.zklighter.elliot.ai/
web_socket_endpoint: wss://mainnet.zklighter.elliot.ai/stream
dry_run: false
agent_name: debot-pair-canary

# Data dump disabled — main bot already records the Frankfurt feed to
# /opt/debot/market_data_btceth.jsonl, the canary would just duplicate it.
enable_data_dump: false
observe_only: false

# Independent history archive so canary state is recoverable without
# stepping on main's snapshot path.
history_archive_dir: /opt/debot-canary/history_archive
history_archive_retention_days: 360

universe_pairs:
- BTC/ETH
max_active_pairs: 1

interval_secs: 5
trading_period_secs: 60

# Same diagnostics as main — we want to see the same eligibility decisions
# so that any divergence is attributable to the binary, not the feed.
pair_selection_lookback_hours_short: 1
pair_selection_lookback_hours_long: 2
adf_p_threshold: 0.15
half_life_max_hours: 2.0
metrics_window_length: 240
warm_start_mode: relaxed
warm_start_min_bars: 60

# Core MR params — main A clone except entry_z_score_base = 1.0 (vs 1.5).
entry_z_score_base: 1.0
entry_z_score_min: 0.8
entry_z_score_max: 1.5
exit_z_score: 0.2
stop_loss_z_score: 4.0
force_close_time_secs: 7200
shutdown_grace_secs: 7260   # 7200 + 60s buffer (single-strategy, no fc=10800)

# Same Round 4 cool-down — protects against the 5/4 re-entry pathology
# regardless of binary version under test.
stop_loss_cooldown_secs: 600

# Risk
risk_pct_per_trade: 0.40
equity_usd_reference: 50    # canary collateral on Lighter sub-account 281474976624819
max_leverage: 5             # conservative; per-leg notional ≈ 50 * 0.4 * 5 / 2 = $50
max_loss_r_mult: 1.0

# Execution
cooldown_secs: 60
slippage_bps: 0
fee_bps: 0
entry_post_only_timeout_secs: 30

# Filters (identical to main)
spread_velocity_max_sigma_per_min: 0.15
spread_trend_max_slope_sigma: 1.0
beta_divergence_max: 0.30
beta_min: 0.30
hedge_ratio_max_deviation: 0.20
entry_vol_lookback_hours: 2
vol_spike_mult: 3.0
net_funding_min_per_hour: -0.01
reeval_jump_z_mult: 1.5

# Phase 2 filters (identical to main)
entry_velocity_block_sigma_per_min: 0.0
funding_entry_z_scale: 0.0
beta_gap_entry_z_scale: 3.0

# Std collapse guard (identical to main)
std_collapse_window_bars: 60
std_collapse_min_ratio: 0.2
std_collapse_observe_only: false

# Circuit breaker (identical to main)
circuit_breaker_tier1_losses: 5
circuit_breaker_tier1_cooldown_secs: 600
circuit_breaker_tier2_losses: 8
circuit_breaker_tier2_cooldown_secs: 3600

# Risk gates — canary budget ($50 collateral, 5x leverage) makes the original
# 50 bps × 5 = 250 bps = $1.25 threshold same-order as per-trade taker noise
# ($0.10–0.20 per round-trip on Lighter standard), so a few unfavorable
# trades trip the sticky halt and smoke coverage silently disappears for
# weeks (bot-strategy#485 — halted 16 days before detection). Relaxed to
# 200 bps × 5 = 1000 bps = 10% equity = $5; this trades away the
# "regression hits canary first" early-warning property (main A/B/C still
# fire at 5%, but canary now fires at 10%) for the ability to actually keep
# the live-execution smoke loop running. Acceptable since the canary's
# primary value is exercising the deploy/execution path, not being the
# tightest risk tripwire.
risk:
  max_daily_loss_bps: 300
  max_daily_loss_action: block
  daily_reset_utc_hour: 0
  max_session_loss_bps: 200
  session_dd_lookback_secs: 2592000
  session_dd_sample_secs: 3600
  max_notional_headroom: 1.0

# Single strategy — canary has no A/B/C split, just one "a" instance.
# This keeps the comparison clean against main A and minimizes Lighter
# /apikeys hits (canary is a 4th sub-account on the shared parent wallet,
# so adding more sub-accounts would compound bot-strategy#163 risk).
strategies:
  - id: a
    agent_name: debot-pair-canary
    exit_z_score: 0.2
    stop_loss_z_score: 4.0
    max_loss_r_mult: 1.0
    equity_usd_reference: 50
    mtf_windows: [15]
    mtf_z_min: 0.5
    force_close_time_secs: 7200
    entry_z_score_base: 1.0
    entry_z_score_min: 0.8
    entry_z_score_max: 1.5
