# Robinhood Chain Lighter launch configuration (#790/#794).
# Two-arm split (bot-strategy#798, 2026-08-18): `freq` and `b`, each on its
# own Lighter sub-account. `b` originally cloned the Frankfurt-B profile
# (wider stop_loss_z=8.0, force_close=10800s, max_leverage=50) to test
# whether more patience reduced the force_close loss asymmetry. Readout
# 2026-08-21 (#798): force_close losses were already near-zero on both arms;
# the dominant loss driver had shifted to `ineligible` exits, and `b`'s
# wider/slower profile made per-trade ineligible losses materially worse
# (avg -$103.74/trade vs freq's -$23.80, biggest single loss -$318.46) while
# bleeding capital ~2x faster than freq on a per-$1000 basis. `b` was
# reverted to freq's entry/exit/stop/force_close params and max_leverage
# (2026-08-21) — only equity_usd_reference ($4,000 vs freq's $2,000) still
# differs between the arms. Top-level scalars below are the shared defaults
# / legacy fallback; the `strategies:` block at the end overrides per-arm
# values. Launch remains DRY_RUN-flagged in-file but the live process
# currently runs with dry_run=false — see runbook before touching this file.

dex_name: lighter
rest_endpoint: https://api.rh.lighter.xyz
web_socket_endpoint: wss://api.rh.lighter.xyz/stream
dry_run: true
agent_name: debot-pair-robinhood-lighter

# Data dump for BT (independent of trading; observe_only must be set explicitly)
enable_data_dump: true
data_dump_file: /opt/debot-robinhood-lighter/market_data_btceth_robinhood_lighter.jsonl
observe_only: false

# Hourly snapshot archive for BT replay warm-start (#69)
# 360 days retention ≈ 168 MB / 8640 files — covers year-long replays and
# ad-hoc historical analysis at trivial disk cost.
history_archive_dir: /opt/debot-robinhood-lighter/history_archive_robinhood_lighter
history_archive_retention_days: 360

# Fixed pair: BTC/ETH only
universe_pairs:
- BTC/ETH
max_active_pairs: 1

# Timing
interval_secs: 5
trading_period_secs: 60

# Pair diagnostics (simplified: relaxed thresholds)
pair_selection_lookback_hours_short: 1
pair_selection_lookback_hours_long: 2
adf_p_threshold: 0.15
half_life_max_hours: 2.0
metrics_window_length: 240
warm_start_mode: relaxed
warm_start_min_bars: 60

# Preserve the Frankfurt canary multi-timeframe entry gate (shared by both arms).
mtf_windows: [15]
mtf_z_min: 0.5

# Frankfurt canary parameters (shared by both arms as of 2026-08-21 — see
# header note; b previously overrode these, reverted after readout).
entry_z_score_base: 1.0
entry_z_score_min: 0.8
entry_z_score_max: 1.5
exit_z_score: 0.2
stop_loss_z_score: 4.0
# bot-strategy#798: halved from 7200 (canary value) on 2026-08-17 for the
# freq arm. Journal review 08-14..08-17 showed most exits hit force_close
# rather than exit_z/stop_loss — the dominant frequency constraint for the
# points-farming objective. b arm now shares this value (reverted 2026-08-21,
# see header note).
force_close_time_secs: 3600
shutdown_grace_secs: 3660

# Post-stop cool-down (#316). 600 s blocks immediate re-entry after a
# stop_loss_z exit on the same direction — Round 4 BT sweep on 5/3-5/8
# byte-exact (#278): Calmar 1.330 vs 0/1800/3600/7200 baselines
# (1.109/1.104/1.055/0.760), MaxDD -25%, PnL -9.4%. Catches the 6-min
# re-entry pathology observed on 2026-05-04 regime shift.
stop_loss_cooldown_secs: 600

# Risk (top-level fallback; per-arm equity_usd_reference / max_leverage set
# in strategies: below, bot-strategy#814).
risk_pct_per_trade: 0.40
equity_usd_reference: 2000
max_leverage: 20  # Fallback only — both arms override this below.
max_loss_r_mult: 1.0

# Execution
cooldown_secs: 60
slippage_bps: 0
fee_bps: 0
entry_post_only_timeout_secs: 30

# Filters (relaxed: let z-score do the work)
spread_velocity_max_sigma_per_min: 0.15
spread_trend_max_slope_sigma: 1.0
beta_divergence_max: 0.30
beta_min: 0.30
# bot-strategy#798 / pairtrade#206: entry-side-only floor on |beta| used for
# leg-B (ETH) sizing. beta_min above only gates entry eligibility on the
# *absolute* value and beta_divergence_max only guards estimate *stability*
# (beta_s vs beta_l) — neither stops a stable-but-low beta from producing a
# dollar-notional-asymmetric pair. Live 2026-08-17 case: beta=0.48 sized
# ~$8,000 short BTC against only ~$3,800 long ETH; a +0.5%/+0.48% parallel
# rally in both legs then cost -$22.55, dominated by the larger unhedged BTC
# leg, independent of spread convergence. 0.6 catches the worst observed
# cases (0.44-0.58 range seen live) while leaving near-1 betas untouched.
sizing_beta_floor: 0.6
hedge_ratio_max_deviation: 0.20
entry_vol_lookback_hours: 2
vol_spike_mult: 3.0
net_funding_min_per_hour: -0.01
reeval_jump_z_mult: 1.5

# Phase 2 filters (BT 2026-04-05: beta_gap=3.0 best, +$0.84 vs baseline +$0.20)
entry_velocity_block_sigma_per_min: 0.0
funding_entry_z_scale: 0.0
beta_gap_entry_z_scale: 3.0

# Std collapse guard (bot-strategy#62). Root cause (warm_start single-OLS-beta
# artifact) was fixed via snapshot v2 spread_history persistence. Guard remains
# as a hard gate against real-market std collapse: blocks entries when
# std < 20% of the rolling median of the last 60 bar stds. 11-day observe-only
# data (2026-04-16 → 2026-04-27) showed only one ~4h episode with |z| ≤ 1.25
# (no entries blocked), confirming flip-to-block is risk-free.
std_collapse_window_bars: 60
std_collapse_min_ratio: 0.2
std_collapse_observe_only: false

# Circuit breaker
circuit_breaker_tier1_losses: 5
circuit_breaker_tier1_cooldown_secs: 600
circuit_breaker_tier2_losses: 8
circuit_breaker_tier2_cooldown_secs: 3600

# Risk gates (bot-strategy#185). All bps fields are 1x-equivalent (market-
# move) and multiplied by EACH ARM'S OWN resolved max_leverage at comparison
# time (bot-strategy#814 made leverage per-instance). As of 2026-08-21 both
# arms run max_leverage=30 (b's 50x reverted, see header note), so both now
# have the same effective daily/session gates: 75bps×30=2250bps (22.5%) /
# 50bps×30=1500bps (15%).
risk:
  max_daily_loss_bps: 75
  max_daily_loss_action: block
  daily_reset_utc_hour: 0
  # Phase 3-1: rolling-peak session DD. Sticky halt + auto-flatten of the
  # breaching instance, cleared only by `sudo touch /opt/debot-robinhood-lighter/RISK_ACK`.
  max_session_loss_bps: 50
  session_dd_lookback_secs: 2592000  # 30 d
  session_dd_sample_secs: 3600       # 1 h
  # Per-leg cap: reference equity × the arm's own max_leverage × 0.25.
  max_notional_headroom: 0.25

# Two-arm split (bot-strategy#798, 2026-08-18; leverage split bot-strategy#814,
# 2026-08-19; b reverted to freq's params/leverage 2026-08-21, see header
# note — only equity_usd_reference still differs between the arms). Field
# values not listed per-arm inherit the top-level scalar above.
strategies:
  - id: freq
    agent_name: debot-pair-robinhood-lighter-freq
    equity_usd_reference: 2000
    max_leverage: 30
  - id: b
    agent_name: debot-pair-robinhood-lighter-b
    equity_usd_reference: 4000
    max_leverage: 30
