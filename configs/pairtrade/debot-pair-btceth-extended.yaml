# Tokyo-hosted Extended Exchange single-bot pairtrade.
# Bootstrap config for bot-strategy#123 Phase 3: run Strategy A's champion
# params (from debot-pair-btceth.yaml) against Extended instead of Lighter,
# with fee_bps bumped to 2.5 for Extended's taker fee. Once 1 week of live
# dump is in hand, Phase 4 grid-searches for Extended-specific A/B/C.

dex_name: extended
# Leave endpoints unset → dex-connector picks Extended mainnet defaults.
rest_endpoint: ""
web_socket_endpoint: ""
dry_run: false
agent_name: debot-pair-btceth-ext

# Data dump — different path from Frankfurt Lighter bot so the two streams
# don't collide if they're ever co-located during migration.
enable_data_dump: true
data_dump_file: /opt/debot/market_data_btceth_extended.jsonl
observe_only: false

history_archive_dir: /opt/debot/history_archive
history_archive_retention_days: 360

universe_pairs:
- BTC/ETH
max_active_pairs: 1

interval_secs: 5
trading_period_secs: 60

pair_selection_lookback_hours_short: 1
pair_selection_lookback_hours_long: 2
adf_p_threshold: 0.15
half_life_max_hours: 2.0
metrics_window_length: 240
warm_start_mode: relaxed
warm_start_min_bars: 60

# Round 2 params (bot-strategy#123 Phase 4 grid, 2026-04-30).
# entry_z=2.0 retained (only profitable zone in the 7-day Apr 23–29 grid).
# fc raised 3600 → 10800: at fc=3600 the live bot exited 80% of trades via
# force_close before MR completed (avg pnl_25bp -$0.54 across the fc=3600
# row). fc=10800 was the most robust cell in the grid (4/4 cells profitable,
# avg pnl_25bp +$0.26, FC% 10%). exit/sl unchanged.
entry_z_score_base: 2.0
entry_z_score_min: 1.5
entry_z_score_max: 2.5
exit_z_score: 0.2
stop_loss_z_score: 4.0
force_close_time_secs: 10800
shutdown_grace_secs: 10860

# bot-strategy#222: fixed equity reference for thresholds and sizing.
# Reduced 500 → 300 on 2026-04-30 to better align with actual deposited
# capital (~$45 observed on-account); Round 2 size-down before raising
# fc gives MR longer to play out without scaling notional risk.
risk_pct_per_trade: 0.40
equity_usd_reference: 300
max_leverage: 1
max_loss_r_mult: 1.0

# Execution — fee_bps bumped from 0 to 2.5 for Extended's taker.
cooldown_secs: 60
slippage_bps: 0
fee_bps: 2.5
# Extended BTC tick size is 10 vs Lighter's 1, so the price grid is ~10x
# coarser and post-only limits take proportionally longer to be crossed.
# Raised from 30s to 120s (conservative 4x of tick-ratio) to reduce taker
# fallbacks while keeping the entry signal fresh. See bot-strategy#165.
entry_post_only_timeout_secs: 120

spread_velocity_max_sigma_per_min: 0.15
spread_trend_max_slope_sigma: 1.0
beta_divergence_max: 0.30
beta_min: 0.30
hedge_ratio_max_deviation: 0.20
entry_vol_lookback_hours: 2
vol_spike_mult: 3.0
net_funding_min_per_hour: -0.01
reeval_jump_z_mult: 1.5

entry_velocity_block_sigma_per_min: 0.0
funding_entry_z_scale: 0.0
beta_gap_entry_z_scale: 3.0

# Std collapse guard (bot-strategy#62). Frankfurt flipped to block on
# 2026-04-27 after 11-day observe data confirmed no real entries were
# blocked. Tokyo Extended saw zero STD_COLLAPSE_OBSERVE emissions in the
# journalctl retention window since deployment, so flip-to-block is at
# least as safe here as on Frankfurt. Blocks entries when std < 20% of
# the rolling median of the last 60 bar stds.
std_collapse_window_bars: 60
std_collapse_min_ratio: 0.2
std_collapse_observe_only: false

# Circuit breaker
circuit_breaker_tier1_losses: 5
circuit_breaker_tier1_cooldown_secs: 600
circuit_breaker_tier2_losses: 8
circuit_breaker_tier2_cooldown_secs: 3600

# Risk gates (bot-strategy#185). All bps fields are leverage-invariant
# (multiplied by max_leverage internally), typical 100–500 bps.
# Enabled per bot-strategy#229 once #216/#217 size-rounding verification
# cleared. max_leverage=1 here, so the bps fields apply at face value
# against equity_usd_reference=$500.
risk:
  # Phase 2: 3% daily DD = $15 cap.
  max_daily_loss_bps: 300
  max_daily_loss_action: block
  daily_reset_utc_hour: 0
  # Phase 3-1: 5% rolling-peak session DD over 30d = $25 cap.
  max_session_loss_bps: 500
  session_dd_lookback_secs: 2592000
  session_dd_sample_secs: 3600
  # Phase 3-4: per-leg notional cap as a multiplier of
  # equity_reference_usd × max_leverage. 1.0 = intended notional with no
  # slack; protects against sizing-math bugs without restricting the
  # strategy.
  max_notional_headroom: 1.0

# MTF (A/B/C round 2 legacy from Lighter Strategy A)
mtf_windows: [15]
mtf_z_min: 0.5

# No multi-strategy split for Phase 3. When Phase 5 runs, a follow-up config
# will reintroduce `strategies:` with Extended-optimized params from the
# Phase 4 grid-search.
